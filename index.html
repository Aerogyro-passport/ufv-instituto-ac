<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rita© · UFV Instituto</title><style>@font-face{font-family:Tecnico;src:url("tecnico_regular.ttf")}@font-face{font-family:Tecnico;src:url("tecnico_bold.ttf");font-weight:700}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Tecnico,Arial,sans-serif;color:#17324d}body{background:#edf4fa}.app{min-height:100vh;display:flex}.lateral{width:205px;min-width:205px;min-height:100vh;background:linear-gradient(180deg,#074b7d 0%,#0b5d96 100%);color:#fff;padding:27px 16px;position:fixed;left:0;top:0;bottom:0}.rita{font-size:48px;line-height:1;font-weight:400;letter-spacing:-2px}.copyright{font-size:14px;vertical-align:top;margin-left:3px}.linea{width:58px;height:3px;background:#51d7d3;margin:20px 0 22px}.nombre{font-size:14px;line-height:20px;letter-spacing:1.4px;text-transform:uppercase;max-width:160px}.contenido{margin-left:205px;width:calc(100% - 205px);min-height:100vh}.cabecera{height:94px;background:#fff;display:flex;align-items:center;padding:0 0 0 46px;border:0}.cabecera img{display:block;width:auto;height:auto;max-height:55px;max-width:480px;object-fit:contain}.zona{min-height:calc(100vh - 94px);display:flex;align-items:center;justify-content:center;padding:45px 30px}.login{width:440px;background:#fff;border:1px solid #d6e0e8;border-radius:8px;padding:27px 36px 24px;box-shadow:0 5px 18px rgba(30,70,100,.04)}.mini{font-size:12px;letter-spacing:2px;color:#5b83a4;text-transform:uppercase;border-bottom:2px solid #41c5cf;padding-bottom:7px;display:inline-block}.login h1{font-size:36px;font-weight:400;margin:20px 0 4px}.intro{font-size:15px;color:#718ba4;line-height:20px;margin:0 0 22px}.campo{margin-bottom:14px}.campo label{display:block;font-size:11px;letter-spacing:1.5px;color:#66829c;margin-bottom:5px}.campo input{width:100%;height:41px;border:1px solid #ccd9e3;border-radius:5px;background:#fbfcfd;padding:0 12px;font-family:Tecnico,Arial,sans-serif;font-size:14px;color:#17324d;outline:none}.campo input:focus{border-color:#1688b3}.pass{position:relative}.pass input{padding-right:40px}.ojo{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:none;color:#52738d;cursor:pointer;font-size:15px}.entrar{width:100%;height:41px;border:0;border-radius:4px;background:#075b96;color:#fff;font-family:Tecnico,Arial,sans-serif;font-size:13px;letter-spacing:4px;cursor:pointer;margin-top:5px}.entrar:hover{background:#064c7d}.pie{border-top:1px solid #e3e9ee;margin-top:38px;padding-top:15px;text-align:center;font-size:11px;line-height:15px;color:#7990a5}@media(max-width:750px){.lateral{width:155px;min-width:155px;padding:25px 13px}.rita{font-size:39px}.nombre{font-size:12px}.contenido{margin-left:155px;width:calc(100% - 155px)}.cabecera{height:82px;padding-left:24px}.cabecera img{max-height:45px;max-width:90%}.zona{min-height:calc(100vh - 82px);padding:25px 18px}.login{width:100%;max-width:440px;padding:25px}.login h1{font-size:31px}}@media(max-width:520px){.app{display:block}.lateral{position:relative;width:100%;min-height:auto;height:auto;padding:18px 22px}.rita{font-size:35px}.linea{margin:13px 0}.nombre{max-width:none}.contenido{margin-left:0;width:100%}.cabecera{height:75px;padding:0 20px}.cabecera img{max-height:42px;max-width:100%}.zona{min-height:calc(100vh - 75px);padding:25px 15px}}</style></head><body><div class="app"><aside class="lateral"><div class="rita">Rita<span class="copyright">©</span></div><div class="linea"></div><div class="nombre">Sistema de Gestión<br>del Esquema de<br>Certificación<br>de Personas</div></aside><main class="contenido"><header class="cabecera"><img src="cabecera1.png" alt="Universidad Francisco de Vitoria · Instituto de Acompañamiento · Servicio de Certificación de Personas"></header><section class="zona"><div class="login"><div class="mini">Acceso al sistema</div><h1>Bienvenido</h1><p class="intro">Identifíquese para acceder al entorno de gestión del Esquema de Certificación de Personas.</p><div class="campo"><label>USUARIO</label><input type="text" placeholder="Introduzca su usuario" autocomplete="username"></div><div class="campo"><label>CONTRASEÑA</label><div class="pass"><input id="clave" type="password" placeholder="Introduzca su contraseña" autocomplete="current-password"><button class="ojo" type="button" onclick="var x=document.getElementById('clave');x.type=x.type==='password'?'text':'password'">◉</button></div></div><button class="entrar" type="button">ENTRAR</button><div class="pie">Acceso restringido a personal autorizado.<br>Los perfiles y permisos se configurarán individualmente.</div></div></section></main></div></body></html>
