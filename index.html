<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rita© | Instituto de Acompañamiento UFV</title>

<style>
@font-face{font-family:Tecnico;src:url("tecnico_regular.ttf") format("truetype");font-weight:400}
@font-face{font-family:Tecnico;src:url("tecnico_bold.ttf") format("truetype");font-weight:700}
@font-face{font-family:Tecnico;src:url("tecnico_regularitalic.ttf") format("truetype");font-weight:400;font-style:italic}
@font-face{font-family:Tecnico;src:url("tecnico_bolditalic.ttf") format("truetype");font-weight:700;font-style:italic}

*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{min-height:100vh;background:#edf5fb;color:#17344e;font-family:Tecnico,Arial,sans-serif}
.app{display:flex;width:100%;min-height:100vh}

/* LATERAL */
.lateral{
width:198px;min-width:198px;min-height:100vh;
background:#034b70;color:#fff;padding:22px 20px 18px;
display:flex;flex-direction:column
}
.rita{
position:relative;display:inline-block;width:max-content;
font-size:51px;line-height:1;font-weight:400;letter-spacing:-2px
}
.copyright{position:absolute;right:-15px;top:-3px;font:13px Arial}
.linea-rita{width:54px;height:3px;background:#54d8d6;margin:23px 0 25px}
.nombre-sistema{
width:150px;font-size:15px;line-height:1.22;
letter-spacing:.7px;text-transform:uppercase
}

/* MENÚ LATERAL */
.menu-lateral{
display:none;width:100%;margin-top:28px;
border-top:1px solid rgba(255,255,255,.22);
padding-top:14px
}
.menu-lateral.visible{display:block}

.boton-lateral{
width:100%;min-height:48px;margin:0 0 8px;padding:8px 9px;
border:1px solid rgba(255,255,255,.25);border-radius:5px;
background:rgba(255,255,255,.08);color:#fff;
font-family:Tecnico,Arial,sans-serif;text-align:left;
display:flex;align-items:center;gap:9px
}
.boton-lateral.activo{cursor:pointer}
.boton-lateral.activo:hover{background:rgba(255,255,255,.15)}
.boton-lateral.inactivo{
opacity:.33;
filter:grayscale(1);
cursor:not-allowed;
background:rgba(255,255,255,.04)
}
.boton-codigo{min-width:29px;font-size:15px;color:#65dcda;font-weight:700}
.boton-lateral.inactivo .boton-codigo{color:#ddd}
.boton-texto{font-size:13px;line-height:1.12;text-transform:uppercase}

.pie-lateral{margin-top:auto;width:100%;padding-bottom:25px}
.pie-lateral img{display:block;width:150px;max-width:100%;height:auto}

/* PRINCIPAL */
.principal{flex:1;min-width:0;min-height:100vh;display:flex;flex-direction:column}
.cabecera{
height:108px;min-height:108px;background:#fff;
display:flex;align-items:center;padding:0 43px
}
.cabecera img{display:block;width:495px;max-width:55vw;height:auto}

.zona{
flex:1;width:100%;background:#edf5fb;
display:flex;flex-direction:column;align-items:center;
padding:32px 35px 30px
}

/* LOGIN */
.login{
width:620px;max-width:95%;background:#fff;
border:1px solid #ccdce7;border-radius:7px;
padding:31px 39px 27px;
box-shadow:0 4px 14px rgba(30,70,100,.04)
}
.login-mini{
display:inline-block;color:#668aa7;font-size:14px;letter-spacing:1.8px;
padding-bottom:6px;border-bottom:3px solid #4dd4d0;margin-bottom:15px
}
.login h1{margin:0 0 7px;font-size:42px;font-weight:400}
.login-intro{margin:0 0 22px;color:#718ca4;font-size:17px;line-height:1.3}
.campo{margin-bottom:15px}
.campo label{
display:block;color:#67859e;font-size:13px;
letter-spacing:1px;margin-bottom:6px;text-transform:uppercase
}
.input-wrap{position:relative}
.campo input{
width:100%;height:51px;padding:0 15px;
border:1px solid #bfd1df;border-radius:4px;
background:#fbfcfd;color:#17344e;
font:17px Tecnico,Arial,sans-serif;outline:none
}
.campo input:focus{border-color:#2389b2}
.password{padding-right:48px!important}
.ver{
position:absolute;right:14px;top:50%;transform:translateY(-50%);
border:0;background:none;color:#557c98;font-size:17px;cursor:pointer
}
.entrar{
width:100%;height:53px;margin-top:5px;border:0;border-radius:4px;
background:#0b70aa;color:#fff;font:16px Tecnico,Arial,sans-serif;
letter-spacing:5px;text-transform:uppercase;cursor:pointer
}
.entrar:hover{background:#075d91}
.aviso{
margin-top:26px;padding-top:15px;border-top:1px solid #dde6ed;
text-align:center;color:#7992a7;font-size:12px;line-height:1.4
}
.error{min-height:18px;margin-top:10px;color:#a84343;text-align:center;font-size:14px}

/* USUARIO IDENTIFICADO */
.panel{
display:none;width:100%;
background:#fff;border:1px solid #c8d2db;
padding:14px 18px 16px
}
.panel.visible{display:block}
.titulo-panel{
font-size:25px;color:#4c6788;
border-bottom:2px solid #4c6788;
padding-bottom:3px;margin-bottom:8px
}
.datos-usuario{font-size:18px;line-height:1.2;color:#222}
.autorizaciones-titulo{
font-size:25px;color:#4c6788;
border-bottom:2px solid #4c6788;
padding-bottom:3px;margin-top:4px;margin-bottom:10px
}

/* ICONOS */
.permisos{
display:flex;flex-wrap:wrap;
align-items:flex-start;justify-content:flex-start;
gap:10px
}
.permiso{
width:82px;border:0;padding:0;margin:0;
background:transparent;transition:transform .12s ease,opacity .12s ease
}
.permiso img{display:block;width:82px;height:auto;border-radius:8px}
.permiso.activo{cursor:pointer}
.permiso.activo:hover{transform:translateY(-2px)}
.permiso.inactivo{
opacity:.28;
filter:grayscale(1);
cursor:not-allowed
}

.salir{
margin-top:14px;border:1px solid #b9ccda;
background:#fff;color:#315675;border-radius:4px;
padding:7px 12px;font:14px Tecnico;cursor:pointer
}

@media(max-width:760px){
.lateral{width:165px;min-width:165px;padding:20px 15px}
.rita{font-size:43px}
.nombre-sistema{font-size:13px;width:125px}
.boton-texto{font-size:11px}
.cabecera{height:90px;min-height:90px;padding:0 25px}
.cabecera img{width:400px;max-width:90%}
.permiso,.permiso img{width:72px}
}
</style>
</head>

<body>
<div class="app">

<aside class="lateral">
<div class="rita">Rita<span class="copyright">©</span></div>
<div class="linea-rita"></div>

<div class="nombre-sistema">
Sistema de Gestión<br>
del Esquema de<br>
Certificación<br>
de Personas
</div>

<nav class="menu-lateral" id="menuLateral">

<button class="boton-lateral" data-permiso="A1" type="button" onclick="abrirArea('A1',this)">
<span class="boton-codigo">A1</span><span class="boton-texto">Área Técnica</span>
</button>

<button class="boton-lateral" data-permiso="A2" type="button" onclick="abrirArea('A2',this)">
<span class="boton-codigo">A2</span><span class="boton-texto">Área de Gestión</span>
</button>

<button class="boton-lateral" data-permiso="A3" type="button" onclick="abrirArea('A3',this)">
<span class="boton-codigo">A3</span><span class="boton-texto">Área de Evaluación</span>
</button>

<button class="boton-lateral" data-permiso="A4" type="button" onclick="abrirArea('A4',this)">
<span class="boton-codigo">A4</span><span class="boton-texto">Área de Formación</span>
</button>

<button class="boton-lateral" data-permiso="A5" type="button" onclick="abrirArea('A5',this)">
<span class="boton-codigo">A5</span><span class="boton-texto">Área de Decisión</span>
</button>

<button class="boton-lateral" data-permiso="A6" type="button" onclick="abrirArea('A6',this)">
<span class="boton-codigo">A6</span><span class="boton-texto">Área de Conflictos</span>
</button>

<button class="boton-lateral" data-permiso="A7" type="button" onclick="abrirArea('A7',this)">
<span class="boton-codigo">A7</span><span class="boton-texto">Área de Mejora</span>
</button>

<button class="boton-lateral" data-permiso="A8" type="button" onclick="abrirArea('A8',this)">
<span class="boton-codigo">A8</span><span class="boton-texto">Configuración</span>
</button>

</nav>

<div class="pie-lateral">
<img src="pie.png" alt="LifeLearning Consultoría - Powered by Rita">
</div>
</aside>

<main class="principal">

<header class="cabecera">
<img src="cabecera1.png" alt="Universidad Francisco de Vitoria - Instituto de Acompañamiento">
</header>

<section class="zona">

<div class="login" id="login">
<div class="login-mini">Acceso al sistema</div>
<h1>Bienvenido</h1>

<p class="login-intro">
Identifíquese para acceder al entorno de gestión del Esquema de Certificación de Personas.
</p>

<form id="loginForm">

<div class="campo">
<label for="usuario">Usuario</label>
<input id="usuario" type="text" autocomplete="username" placeholder="angel, luis, pilar...">
</div>

<div class="campo">
<label for="password">Contraseña</label>
<div class="input-wrap">
<input id="password" class="password" type="password" autocomplete="current-password" placeholder="Introduzca su contraseña">
<button class="ver" id="verPassword" type="button" aria-label="Mostrar contraseña">◉</button>
</div>
</div>

<button class="entrar" type="submit">Entrar</button>
<div class="error" id="error"></div>
</form>

<div class="aviso">Acceso restringido a personal autorizado.</div>
</div>

<div class="panel" id="panel">

<div class="titulo-panel">Usuario identificado</div>
<div class="datos-usuario" id="nombreUsuario"></div>
<div class="datos-usuario" id="rolUsuario"></div>
<div class="datos-usuario" id="codigoUsuario"></div>

<div class="autorizaciones-titulo">Autorizaciones</div>

<div class="permisos">

<button class="permiso" data-permiso="A1" type="button" onclick="abrirArea('A1',this)">
<img src="ICOA1.png" alt="A1 Área Técnica">
</button>

<button class="permiso" data-permiso="A2" type="button" onclick="abrirArea('A2',this)">
<img src="ICOA2.png" alt="A2 Área de Gestión">
</button>

<button class="permiso" data-permiso="A3" type="button" onclick="abrirArea('A3',this)">
<img src="ICOA3.png" alt="A3 Área de Evaluación">
</button>

<button class="permiso" data-permiso="A4" type="button" onclick="abrirArea('A4',this)">
<img src="ICOA4.png" alt="A4 Área de Formación">
</button>

<button class="permiso" data-permiso="A5" type="button" onclick="abrirArea('A5',this)">
<img src="ICOA5.png" alt="A5 Área de Decisión">
</button>

<button class="permiso" data-permiso="A6" type="button" onclick="abrirArea('A6',this)">
<img src="ICOA6.png" alt="A6 Área de Conflictos">
</button>

<button class="permiso" data-permiso="A7" type="button" onclick="abrirArea('A7',this)">
<img src="ICOA7.png" alt="A7 Área de Mejora">
</button>

<button class="permiso" data-permiso="A8" type="button" onclick="abrirArea('A8',this)">
<img src="ICOA8.png" alt="A8 Configuración">
</button>

</div>

<button class="salir" type="button" onclick="cerrarSesion()">Cerrar sesión</button>

</div>

</section>
</main>
</div>

<script src="usuarios.js"></script>

<script>
const login=document.getElementById("login");
const panel=document.getElementById("panel");
const menu=document.getElementById("menuLateral");
const formulario=document.getElementById("loginForm");
const campoUsuario=document.getElementById("usuario");
const password=document.getElementById("password");
const error=document.getElementById("error");
const botonVer=document.getElementById("verPassword");

function aplicarPermisos(){
document.querySelectorAll("[data-permiso]").forEach(el=>{
const permitido=tienePermiso(el.dataset.permiso);
el.classList.remove("activo","inactivo");
el.classList.add(permitido?"activo":"inactivo");
el.disabled=!permitido;
});
}

function mostrarUsuario(u){
login.style.display="none";
panel.classList.add("visible");
menu.classList.add("visible");

document.getElementById("nombreUsuario").textContent=u.nombre;
document.getElementById("rolUsuario").textContent=u.rol||"Usuario";
document.getElementById("codigoUsuario").textContent="Código: "+u.codigo;

aplicarPermisos();
}

botonVer.addEventListener("click",()=>{
password.type=password.type==="password"?"text":"password";
});

formulario.addEventListener("submit",e=>{
e.preventDefault();
error.textContent="";

const u=buscarUsuario(campoUsuario.value,password.value);

if(!u){
error.textContent="Usuario o contraseña incorrectos.";
return;
}

mostrarUsuario(iniciarSesion(u));
});

function abrirArea(codigo,elemento){
if(elemento&&elemento.disabled)return;
if(!tienePermiso(codigo))return;
alert(codigo+" · Área en preparación");
}

const sesionActiva=usuarioActivo();
if(sesionActiva)mostrarUsuario(sesionActiva);
</script>

</body>
</html>
