<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rita© | Instituto de Acompañamiento UFV</title>

<style>
@font-face{
    font-family:"Tecnico";
    src:url("tecnico_regular.ttf") format("truetype");
    font-weight:400;
    font-style:normal;
}
@font-face{
    font-family:"Tecnico";
    src:url("tecnico_bold.ttf") format("truetype");
    font-weight:700;
    font-style:normal;
}
@font-face{
    font-family:"Tecnico";
    src:url("tecnico_regularitalic.ttf") format("truetype");
    font-weight:400;
    font-style:italic;
}
@font-face{
    font-family:"Tecnico";
    src:url("tecnico_bolditalic.ttf") format("truetype");
    font-weight:700;
    font-style:italic;
}

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:"Tecnico",Arial,sans-serif;
    color:#17344e;
}

body{
    min-height:100vh;
    background:#edf5fb;
}

.app{
    min-height:100vh;
    display:flex;
}

/* =========================
   BANDA LATERAL AZUL
   ========================= */

.lateral{
    width:260px;
    min-width:260px;
    min-height:100vh;
    background:linear-gradient(180deg,#075a91 0%,#0d689f 100%);
    color:#fff;
    padding:30px 29px 22px;
    display:flex;
    flex-direction:column;
}

.rita{
    position:relative;
    display:inline-block;
    width:max-content;
    font-size:66px;
    line-height:1;
    font-weight:400;
    letter-spacing:-3px;
}

.copyright{
    position:absolute;
    right:-18px;
    top:-5px;
    font-family:Arial,sans-serif;
    font-size:17px;
    font-weight:400;
}

.linea-rita{
    width:72px;
    height:4px;
    margin-top:27px;
    margin-bottom:31px;
    background:#4dd4d0;
}

.nombre-sistema{
    max-width:185px;
    font-size:20px;
    line-height:1.27;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

/* PIE DENTRO DE LA BANDA AZUL */

.pie-lateral{
    margin-top:auto;
    width:100%;
    display:flex;
    justify-content:center;
    align-items:flex-end;
    padding-top:30px;
}

.pie-lateral img{
    display:block;
    width:190px;
    max-width:100%;
    height:auto;
    object-fit:contain;
}

/* =========================
   PARTE DERECHA
   ========================= */

.principal{
    flex:1;
    min-width:0;
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   CABECERA
   ========================= */

.cabecera{
    height:122px;
    min-height:122px;
    background:#fff;
    display:flex;
    align-items:center;
    padding:0 58px;
}

.cabecera img{
    display:block;
    width:420px;
    max-width:48vw;
    height:auto;
    object-fit:contain;
}

/* =========================
   ZONA CENTRAL
   ========================= */

.zona{
    flex:1;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:65px 30px 30px;
    background:#edf5fb;
}

/* =========================
   LOGIN
   ========================= */

.login{
    width:680px;
    max-width:calc(100% - 60px);
    margin:0 auto;
    background:#fff;
    border:1px solid #d6e0e8;
    border-radius:9px;
    padding:43px 54px 38px;
    box-shadow:0 6px 20px rgba(30,70,100,.05);
}

.login-mini{
    display:inline-block;
    margin-bottom:18px;
    padding-bottom:7px;
    border-bottom:3px solid #4dd4d0;
    color:#6d8ca6;
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
}

.login h1{
    margin:0 0 8px;
    color:#17344e;
    font-size:50px;
    line-height:1.05;
    font-weight:400;
}

.login-intro{
    margin:0 0 28px;
    color:#718ca4;
    font-size:20px;
    line-height:1.35;
}

.campo{
    margin-bottom:17px;
}

.campo label{
    display:block;
    margin-bottom:7px;
    color:#6d89a2;
    font-size:14px;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.input-wrap{
    position:relative;
}

.campo input{
    width:100%;
    height:58px;
    padding:0 17px;
    border:1px solid #c8d7e3;
    border-radius:5px;
    outline:none;
    background:#fbfcfd;
    color:#17344e;
    font-family:"Tecnico",Arial,sans-serif;
    font-size:19px;
}

.campo input:focus{
    border-color:#3d91bd;
    box-shadow:0 0 0 2px rgba(61,145,189,.08);
}

.campo input::placeholder{
    color:#929ca5;
}

.password{
    padding-right:55px !important;
}

.ver{
    position:absolute;
    top:50%;
    right:16px;
    transform:translateY(-50%);
    width:22px;
    height:22px;
    border:0;
    padding:0;
    background:transparent;
    color:#557c98;
    font-size:18px;
    line-height:22px;
    cursor:pointer;
}

.entrar{
    width:100%;
    height:58px;
    margin-top:7px;
    border:0;
    border-radius:4px;
    background:#09669f;
    color:#fff;
    font-family:"Tecnico",Arial,sans-serif;
    font-size:17px;
    letter-spacing:5px;
    text-transform:uppercase;
    cursor:pointer;
}

.entrar:hover{
    background:#075987;
}

.aviso{
    margin-top:35px;
    padding-top:20px;
    border-top:1px solid #dce5ec;
    color:#7992a7;
    text-align:center;
    font-size:14px;
    line-height:1.35;
}

/* =========================
   FUTURA ZONA DE PERMISOS
   ========================= */

.permisos{
    width:100%;
    max-width:1050px;
    min-height:150px;
    margin:22px auto 0;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* =========================
   ADAPTACIÓN
   ========================= */

@media(max-width:900px){

    .lateral{
        width:205px;
        min-width:205px;
        padding:25px 20px 20px;
    }

    .rita{
        font-size:55px;
    }

    .nombre-sistema{
        font-size:16px;
    }

    .pie-lateral img{
        width:155px;
    }

    .cabecera{
        height:105px;
        min-height:105px;
        padding:0 35px;
    }

    .cabecera img{
        width:360px;
    }

    .zona{
        padding:45px 20px 25px;
    }

    .login{
        width:600px;
        max-width:calc(100% - 30px);
        padding:38px 42px 34px;
    }

    .login h1{
        font-size:43px;
    }
}

@media(max-width:650px){

    .app{
        display:block;
    }

    .lateral{
        width:100%;
        min-width:100%;
        min-height:auto;
        padding:20px 25px;
    }

    .rita{
        font-size:46px;
    }

    .linea-rita{
        margin-top:18px;
        margin-bottom:18px;
    }

    .nombre-sistema{
        max-width:none;
    }

    .pie-lateral{
        justify-content:flex-start;
        margin-top:25px;
    }

    .pie-lateral img{
        width:170px;
    }

    .principal{
        min-height:auto;
    }

    .cabecera{
        height:90px;
        min-height:90px;
        padding:0 22px;
    }

    .cabecera img{
        width:340px;
        max-width:100%;
    }

    .zona{
        min-height:calc(100vh - 90px);
        padding:30px 15px;
    }

    .login{
        width:100%;
        max-width:100%;
        padding:32px 28px;
    }

    .login h1{
        font-size:39px;
    }

    .login-intro{
        font-size:18px;
    }

    .permisos{
        min-height:120px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="lateral">

        <div class="rita">
            Rita
            <span class="copyright">©</span>
        </div>

        <div class="linea-rita"></div>

        <div class="nombre-sistema">
            Sistema de Gestión<br>
            del Esquema de<br>
            Certificación<br>
            de Personas
        </div>

        <div class="pie-lateral">
            <img src="pie.png" alt="LifeLearning Consultoría - Powered by Rita">
        </div>

    </aside>

    <main class="principal">

        <header class="cabecera">
            <img
                src="cabecera1.png"
                alt="Universidad Francisco de Vitoria - Instituto de Acompañamiento">
        </header>

        <section class="zona">

            <div class="login">

                <div class="login-mini">
                    Acceso al sistema
                </div>

                <h1>Bienvenido</h1>

                <p class="login-intro">
                    Identifíquese para acceder al entorno de gestión del
                    Esquema de Certificación de Personas.
                </p>

                <form id="loginForm">

                    <div class="campo">

                        <label for="usuario">
                            Usuario
                        </label>

                        <input
                            id="usuario"
                            name="usuario"
                            type="text"
                            autocomplete="username"
                            placeholder="Introduzca su usuario">

                    </div>

                    <div class="campo">

                        <label for="password">
                            Contraseña
                        </label>

                        <div class="input-wrap">

                            <input
                                id="password"
                                name="password"
                                class="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Introduzca su contraseña">

                            <button
                                class="ver"
                                id="verPassword"
                                type="button"
                                aria-label="Mostrar contraseña">
                                ◉
                            </button>

                        </div>

                    </div>

                    <button class="entrar" type="submit">
                        Entrar
                    </button>

                </form>

                <div class="aviso">
                    Acceso restringido a personal autorizado.<br>
                    Los perfiles y permisos se configurarán individualmente.
                </div>

            </div>

            <!-- AQUÍ IRÁN LOS ICONOS DE PERMISOS -->
            <div class="permisos" id="zonaPermisos"></div>

        </section>

    </main>

</div>

<script>
const botonVer = document.getElementById("verPassword");
const password = document.getElementById("password");

botonVer.addEventListener("click",function(){

    if(password.type === "password"){
        password.type = "text";
        botonVer.textContent = "●";
        botonVer.setAttribute("aria-label","Ocultar contraseña");
    }else{
        password.type = "password";
        botonVer.textContent = "◉";
        botonVer.setAttribute("aria-label","Mostrar contraseña");
    }

});

document.getElementById("loginForm").addEventListener("submit",function(e){
    e.preventDefault();
});
</script>

</body>
</html>
