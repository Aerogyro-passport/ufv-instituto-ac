<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rita© | A10 Gestión Económica</title>
<style>
@font-face{font-family:Tecnico;src:url("tecnico_regular.ttf")}@font-face{font-family:Tecnico;src:url("tecnico_bold.ttf");font-weight:700}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#edf5fb;color:#17344e;font-family:Tecnico,Arial,sans-serif;font-size:24px}.app{display:flex;min-height:100vh}.lateral{width:350px;min-width:350px;background:#003B5D;color:#fff;padding:38px 32px;display:flex;flex-direction:column}.rita{font-size:82px}.linea{width:92px;height:5px;background:#4dd4d0;margin:30px 0}.nombre{font-size:24px;line-height:1.3;text-transform:uppercase}.menu{margin-top:25px;border-top:1px solid #ffffff38;padding-top:15px}.menu button{width:100%;margin-bottom:7px;padding:10px;border:1px solid #ffffff45;border-radius:5px;background:#ffffff12;color:#fff;font:17px Tecnico;text-align:left;cursor:pointer}.menu button.actual{background:#fff;color:#003B5D}.pie{margin-top:auto}.pie img{width:100%}.principal{flex:1}.cabecera{height:185px;background:#fff;display:flex;align-items:center;padding:0 70px}.cabecera img{width:840px;max-width:75vw}.zona{padding:35px 42px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h1{margin:0;font-size:54px;font-weight:400}.volver{padding:12px 18px;border:1px solid #b8cad7;background:#fff;color:#315675;border-radius:5px;font:21px Tecnico;cursor:pointer}.tabs{display:flex;gap:10px;margin-bottom:20px}.tab{padding:15px 24px;border:2px solid #bfd0dc;background:#fff;color:#45647d;border-radius:7px;font:27px Tecnico;cursor:pointer}.tab.activa{background:#0873ae;color:#fff;border-color:#0873ae}.panel{display:none;background:#fff;border:2px solid #cbd9e3;border-radius:8px;padding:25px}.panel.activo{display:block}.panel h2{margin:0 0 20px;font-size:38px;font-weight:400}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 25px}.campo{display:flex;flex-direction:column;gap:7px}.campo.ancho{grid-column:1/-1}.campo label{font-size:20px;font-weight:700;color:#58738c;text-transform:uppercase}.campo input,.campo select,.campo textarea{border:2px solid #bfd0dc;border-radius:6px;padding:11px 13px;font:22px Tecnico}.campo input,.campo select{height:58px}.campo textarea{min-height:100px}.btn{padding:13px 20px;border:0;border-radius:6px;background:#0873ae;color:#fff;font:22px Tecnico;cursor:pointer}.acciones{margin-top:20px}.tabla{margin-top:25px;border:1px solid #cbd9e3;border-radius:7px;overflow:hidden}.fila{display:grid;grid-template-columns:130px 1fr 190px 150px 180px 120px;gap:10px;padding:13px 15px;border-bottom:1px solid #dce5eb;align-items:center}.fila:last-child{border-bottom:0}.cab{background:#e8f0f5;font-weight:700}.estado{padding:7px;border-radius:5px;text-align:center;font-weight:700}.PENDIENTE{background:#f5dc68}.PAGADO{background:#86d49e}.EXENTO{background:#d8e7f2}.DEVUELTO{background:#efaaaa}.BONIFICADO{background:#d9c8ef}.vacio{padding:30px;text-align:center;color:#7d92a1}
</style>
</head>
<body>
<div class="app">
<aside class="lateral"><div class="rita">Rita©</div><div class="linea"></div><div class="nombre">Sistema de Gestión<br>del Esquema de<br>Certificación de Personas</div>
<nav class="menu">
<button onclick="location.href='A1.html'">A1 · ÁREA TÉCNICA</button><button onclick="location.href='A2.html'">A2 · ÁREA DE GESTIÓN</button><button disabled>A3 · ÁREA DE EVALUACIÓN</button><button disabled>A4 · ÁREA DE FORMACIÓN</button><button disabled>A5 · ÁREA DE DECISIÓN</button><button disabled>A6 · ÁREA DE CONFLICTOS</button><button disabled>A7 · ÁREA DE MEJORA</button><button onclick="location.href='A8.html'">A8 · CONFIGURACIÓN</button><button onclick="location.href='A9.html'">A9 · AVISOS</button><button class="actual">A10 · GESTIÓN ECONÓMICA</button>
</nav><div class="pie"><img src="pie.png" alt=""></div></aside>

<main class="principal"><header class="cabecera"><img src="cabecera1.png" alt=""></header><section class="zona">
<div class="top"><h1>A10 · Gestión Económica</h1><button class="volver" onclick="location.href='index.html'">Volver al inicio</button></div>

<div class="tabs"><button class="tab activa" onclick="modo('cobros',this)">Gestión de cobros</button><button class="tab" onclick="modo('tarifas',this)">Tarifas</button></div>

<div class="panel activo" id="cobros">
<h2>Gestión de cobros</h2>
<div class="grid">
<div class="campo"><label>Expediente</label><input id="cExp"></div>
<div class="campo"><label>Persona</label><input id="cPersona"></div>
<div class="campo"><label>Concepto</label><select id="cConcepto"><option>CERTIFICACIÓN INICIAL</option><option>RENOVACIÓN / RECERTIFICACIÓN</option><option>FORMACIÓN</option><option>OTRO</option></select></div>
<div class="campo"><label>Importe (€)</label><input id="cImporte" type="number" step=".01"></div>
<div class="campo"><label>Estado</label><select id="cEstado"><option>PENDIENTE</option><option>PAGADO</option><option>EXENTO</option><option>BONIFICADO</option><option>DEVUELTO</option></select></div>
<div class="campo"><label>Fecha prevista</label><input id="cPrevista" type="date"></div>
<div class="campo"><label>Fecha de cobro</label><input id="cCobro" type="date"></div>
<div class="campo"><label>Referencia</label><input id="cRef"></div>
<div class="campo ancho"><label>Justificante / referencia documental</label><input id="cJust"></div>
<div class="campo ancho"><label>Observaciones</label><textarea id="cObs"></textarea></div>
</div>
<div class="acciones"><button class="btn" onclick="altaCobro()">Guardar cobro</button></div>
<div class="tabla"><div class="fila cab"><div>EXPEDIENTE</div><div>PERSONA</div><div>CONCEPTO</div><div>IMPORTE</div><div>ESTADO</div><div>FECHA</div></div><div id="listaCobros"></div></div>
</div>

<div class="panel" id="tarifas">
<h2>Tarifas</h2>
<div class="grid">
<div class="campo"><label>Código</label><input id="tCodigo"></div>
<div class="campo"><label>Concepto</label><select id="tConcepto"><option>CERTIFICACIÓN INICIAL</option><option>RENOVACIÓN / RECERTIFICACIÓN</option><option>FORMACIÓN</option><option>OTRO</option></select></div>
<div class="campo"><label>Esquema</label><input id="tEsquema" placeholder="TODOS / MENTOR / ..."></div>
<div class="campo"><label>Importe (€)</label><input id="tImporte" type="number" step=".01"></div>
<div class="campo"><label>Vigente desde</label><input id="tDesde" type="date"></div>
<div class="campo"><label>Vigente hasta</label><input id="tHasta" type="date"></div>
<div class="campo"><label>Estado</label><select id="tEstado"><option>ACTIVA</option><option>INACTIVA</option></select></div>
<div class="campo ancho"><label>Observaciones</label><textarea id="tObs"></textarea></div>
</div>
<div class="acciones"><button class="btn" onclick="altaTarifa()">Guardar tarifa</button></div>
<div class="tabla"><div class="fila cab"><div>CÓDIGO</div><div>CONCEPTO</div><div>ESQUEMA</div><div>IMPORTE</div><div>ESTADO</div><div>DESDE</div></div><div id="listaTarifas"></div></div>
</div>

</section></main></div>

<script src="usuarios.js"></script>
<script>
let COBROS=[],TARIFAS=[];

function modo(id,b){
document.querySelectorAll(".panel").forEach(x=>x.classList.remove("activo"));
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("activa"));
document.getElementById(id).classList.add("activo");b.classList.add("activa");
}

function altaCobro(){
COBROS.push({exp:cExp.value,persona:cPersona.value,concepto:cConcepto.value,importe:Number(cImporte.value||0),estado:cEstado.value,prevista:cPrevista.value,cobro:cCobro.value,ref:cRef.value,just:cJust.value,obs:cObs.value});
pintarCobros();["cExp","cPersona","cImporte","cPrevista","cCobro","cRef","cJust","cObs"].forEach(x=>document.getElementById(x).value="");
}

function pintarCobros(){
listaCobros.innerHTML=COBROS.length?COBROS.map(x=>`<div class="fila"><div>${x.exp}</div><div>${x.persona}</div><div>${x.concepto}</div><div>${x.importe.toFixed(2)} €</div><div><span class="estado ${x.estado}">${x.estado}</span></div><div>${x.cobro||x.prevista||""}</div></div>`).join(""):'<div class="vacio">No hay cobros registrados.</div>';
}

function altaTarifa(){
TARIFAS.push({codigo:tCodigo.value,concepto:tConcepto.value,esquema:tEsquema.value||"TODOS",importe:Number(tImporte.value||0),desde:tDesde.value,hasta:tHasta.value,estado:tEstado.value,obs:tObs.value});
pintarTarifas();["tCodigo","tEsquema","tImporte","tDesde","tHasta","tObs"].forEach(x=>document.getElementById(x).value="");
}

function pintarTarifas(){
listaTarifas.innerHTML=TARIFAS.length?TARIFAS.map(x=>`<div class="fila"><div>${x.codigo}</div><div>${x.concepto}</div><div>${x.esquema}</div><div>${x.importe.toFixed(2)} €</div><div>${x.estado}</div><div>${x.desde}</div></div>`).join(""):'<div class="vacio">No hay tarifas definidas.</div>';
}

pintarCobros();pintarTarifas();
</script>
</body>
</html>
