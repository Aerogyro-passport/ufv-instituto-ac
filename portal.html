<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rita© | Portal personal</title>
<style>
@font-face{font-family:T;src:url("tecnico_regular.ttf")}@font-face{font-family:T;src:url("tecnico_bold.ttf");font-weight:700}*{box-sizing:border-box}body{margin:0;background:#edf5fb;color:#17344e;font:22px T,Arial}.head{background:#003B5D;color:#fff;padding:28px 5%}.head b{font-size:38px}.head span{display:block;color:#cfe4ef;margin-top:5px}.main{max-width:1200px;margin:auto;padding:28px}.card{background:#fff;border:2px solid #cad9e3;border-radius:9px;padding:24px;margin-bottom:18px}h1,h2{font-weight:400;margin:0 0 12px}.dato{font-size:20px;line-height:1.5}.ruta{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.paso{border:0;padding:14px 6px;text-align:center;border-radius:6px;background:#e5e9ec;color:#758692;font:18px T;cursor:default}.paso.on{background:#d9eef5;color:#1c6488;cursor:pointer}.paso.ok{background:#d9efdf;color:#2d7952;cursor:pointer}.paso.sel{box-shadow:0 0 0 3px #4dd4d0 inset}.paso.lock{opacity:.72}.ev{border:2px solid #d7e2e9;border-radius:7px;padding:17px;margin:12px 0}.evtop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.tipo{color:#617f95;font-weight:700}.est{min-width:125px;min-height:70px;padding:9px 12px;border-radius:18px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;color:#203544}.SIN_EVIDENCIA,.INSUFICIENTE{background:#f4c6c6;color:#6d1717}.PENDIENTE_VALIDACION{background:#f6e79b;color:#544300}.VALIDADA{background:#cdebd8;color:#174c30}.BLOQUEADA{background:#e1e4e7;color:#35414a}.met{font-size:18px;color:#6c8293}.up{margin-top:12px;padding-top:12px;border-top:1px solid #dde6eb;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.up input{font:18px T}.btn{border:0;border-radius:6px;background:#0873ae;color:#fff;padding:11px 16px;font:19px T;cursor:pointer}.btn:disabled{opacity:.35}.pdf{display:inline-block;text-decoration:none;background:#003B5D;color:#fff;padding:11px 16px;border-radius:6px}.err{color:#a33d3d}.hide{display:none}.sin{color:#6c8293;font-size:20px}@media(max-width:800px){.ruta{grid-template-columns:1fr}.evtop{display:block}.est{margin-top:10px}.up{display:block}.up input{margin-bottom:10px}}
</style></head><body>
<div class="head"><b>PORTAL PERSONAL Rita©</b><span>SERVICIO DE CERTIFICACIÓN DE PERSONAS · Instituto de Acompañamiento de la UFV</span></div>
<main class="main">
<div class="card" id="carga">Accediendo a su expediente...</div>
<div id="contenido" class="hide">
<div class="card"><h1 id="nombre"></h1><div class="dato" id="datos"></div>
<div class="ruta">
<button class="paso" id="p1" data-llave="ADMISION">LLAVE 1<br>ADMISIÓN</button>
<button class="paso" id="p2" data-llave="CUALIFICACION">LLAVE 2<br>CUALIFICACIÓN</button>
<button class="paso" id="p3" data-llave="EVALUACION">LLAVE 3<br>EVALUACIÓN</button>
<button class="paso" id="p4">DECISIÓN</button>
<button class="paso" id="p5">CERTIFICACIÓN</button>
</div>
<a id="pdf" class="pdf hide" target="_blank">DESCARGAR INSTRUCCIONES</a></div>
<div class="card"><h2 id="tituloReq">Mis requisitos</h2><div id="evidencias"></div></div>
</div>
</main>
<iframe id="x" src="q7m2x9v4.html" style="display:none"></iframe>
<script>
const $=x=>document.getElementById(x),token=new URLSearchParams(location.search).get("t")||"",x=$("x");let ready=false,DATA=null,LLAVE="ADMISION";
const id=()=>crypto.getRandomValues(new Uint32Array(2)).join("");
function ask(tipo,data={},timeout=60000){return new Promise((ok,no)=>{if(!ready)return no(Error("Sistema no disponible"));const i=id(),tm=setTimeout(()=>{removeEventListener("message",h);no(Error("Sin respuesta del sistema"))},timeout);function h(e){if(e.origin!==location.origin||e.data?.id!==i)return;clearTimeout(tm);removeEventListener("message",h);e.data.ok?ok(e.data):no(Error(e.data.error||"Error"))}addEventListener("message",h);x.contentWindow.postMessage({tipo,id:i,...data},location.origin)})}
function estadoLlaves(e){["p1","p2","p3","p4","p5"].forEach(z=>$(z).className="paso lock");$("p1").className="paso on";if(e.llave_actual==="CUALIFICACION"){$("p1").className="paso ok";$("p2").className="paso on"}if(e.llave_actual==="EVALUACION"){$("p1").className="paso ok";$("p2").className="paso ok";$("p3").className="paso on"}pintarSeleccion()}
function pintarSeleccion(){["p1","p2","p3"].forEach(z=>$(z).classList.remove("sel"));if(LLAVE==="ADMISION")$("p1").classList.add("sel");if(LLAVE==="CUALIFICACION")$("p2").classList.add("sel");if(LLAVE==="EVALUACION")$("p3").classList.add("sel")}
function render(){if(!DATA)return;const e=DATA.expediente;$("nombre").textContent=e.nombre_completo;$("datos").innerHTML=`<b>EXPEDIENTE:</b> ${e.codigo}<br><b>ESQUEMA:</b> ${e.esquema_nombre}<br><b>ESTADO:</b> ${e.estado}<br><b>FASE:</b> ${e.fase}`;estadoLlaves(e);if(DATA.pdf){$("pdf").href=DATA.pdf;$("pdf").classList.remove("hide")}const lista=DATA.evidencias.filter(v=>v.nivel_llave===LLAVE);$("tituloReq").textContent=LLAVE==="ADMISION"?"Mis requisitos · LLAVE 1 · ADMISIÓN":LLAVE==="CUALIFICACION"?"Mis requisitos · LLAVE 2 · CUALIFICACIÓN":"Mis requisitos · LLAVE 3 · EVALUACIÓN";$("evidencias").innerHTML=lista.length?lista.map(v=>`<div class="ev"><div class="evtop"><div><span class="tipo">${v.tipo_requisito} · ${v.codigo_requisito}</span><h2>${v.titulo}</h2></div><span class="est ${v.estado}">${v.estado.replaceAll("_"," ")}</span></div><div>${v.descripcion||""}</div><div class="met"><b>Método de comprobación:</b> ${v.metodo_comprobacion||"No especificado"}</div>${v.motivo_insuficiente?`<div class="err"><b>Motivo:</b> ${v.motivo_insuficiente}</div>`:""}${["SIN_EVIDENCIA","INSUFICIENTE"].includes(v.estado)?`<div class="up"><input type="file" id="f-${v.codigo}"><button class="btn" type="button" data-subir="${v.codigo}">SUBIR EVIDENCIA</button></div>`:""}</div>`).join(""):'<div class="sin">No hay requisitos disponibles en esta fase.</div>';document.querySelectorAll("[data-subir]").forEach(b=>b.onclick=()=>subir(b.dataset.subir))}
async function load(){try{DATA=await ask("RITA_PORTAL",{token});$("carga").classList.add("hide");$("contenido").classList.remove("hide");render()}catch(e){$("carga").innerHTML='<span class="err">'+e.message+"</span>"}}
async function subir(c){const inp=$("f-"+c),f=inp?.files?.[0];if(!f)return alert("Seleccione un archivo.");try{await ask("RITA_APORTAR_EVIDENCIA",{token,evidencia_codigo:c,archivo:f},90000);await load()}catch(e){alert(e.message)}}
$("p1").onclick=()=>{LLAVE="ADMISION";render()};$("p2").onclick=()=>{if(DATA?.expediente?.llave_actual==="ADMISION")return;LLAVE="CUALIFICACION";render()};$("p3").onclick=()=>{if(DATA?.expediente?.llave_actual!=="EVALUACION")return;LLAVE="EVALUACION";render()};
x.onload=()=>{ready=true;if(!token)$("carga").innerHTML='<span class="err">Falta el acceso personal.</span>';else load()};
</script></body></html>
