<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rita© | Portal personal</title><style>
@font-face{font-family:T;src:url("tecnico_regular.ttf")}@font-face{font-family:T;src:url("tecnico_bold.ttf");font-weight:700}*{box-sizing:border-box}body{margin:0;background:#edf5fb;color:#17344e;font:22px T,Arial}.head{background:#003B5D;color:#fff;padding:28px 5%}.head b{font-size:38px}.head span{display:block;color:#cfe4ef;margin-top:5px}.main{max-width:1200px;margin:auto;padding:28px}.card{background:#fff;border:2px solid #cad9e3;border-radius:9px;padding:24px;margin-bottom:18px}h1,h2{font-weight:400;margin:0 0 12px}.dato{font-size:20px;line-height:1.5}.ruta{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.paso{border:0;padding:14px 6px;text-align:center;border-radius:6px;background:#e5e9ec;color:#758692;font:18px T;cursor:default}.paso.on{background:#d9eef5;color:#1c6488;cursor:pointer}.paso.ok{background:#d9efdf;color:#2d7952;cursor:pointer}.paso.sel{box-shadow:0 0 0 3px #4dd4d0 inset}.paso.lock{opacity:.72}.ev{border:2px solid #d7e2e9;border-radius:7px;padding:17px;margin:12px 0}.evtop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.tipo{color:#617f95;font-weight:700}.est{min-width:130px;min-height:72px;padding:10px 13px;border-radius:18px;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15}.SIN_EVIDENCIA,.INSUFICIENTE{background:#f4c6c6;color:#651515}.PENDIENTE_VALIDACION{background:#f6e79b;color:#4d3d00}.VALIDADA{background:#cdebd8;color:#16452c}.BLOQUEADA{background:#e1e4e7;color:#303b43}.met{font-size:18px;color:#6c8293}.up{margin-top:12px;padding-top:12px;border-top:1px solid #dde6eb;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.archivo{font:18px T;max-width:500px}.btn{border:0;border-radius:6px;background:#0873ae;color:#fff;padding:11px 16px;font:19px T;cursor:pointer}.btn:disabled{opacity:.4}.pdf{display:inline-block;text-decoration:none;background:#003B5D;color:#fff;padding:11px 16px;border-radius:6px}.err{color:#a33d3d}.hide{display:none}.sin{color:#6c8293;font-size:20px}.nomarchivo{font-size:17px;color:#48677d}.estado-proceso{border:2px solid #4dd4d0;background:#f1fbfb;border-radius:8px;padding:18px 20px;margin-top:16px}.estado-proceso strong{font-size:24px;color:#003B5D}.decision{border:2px solid #bfd0dc;background:#f8fbfd;border-radius:8px;padding:18px;margin-top:14px}.decision.favorable{border-color:#378b62;background:#f1faf4}.decision.desfavorable{border-color:#b74c4c;background:#fff4f4}.porque{margin-top:12px;padding:14px;background:#fff;border-left:5px solid #4dd4d0}.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%) translateY(-120px);z-index:9999;background:#237346;color:#fff;border:3px solid #fff;border-radius:10px;padding:18px 32px;font-size:25px;font-weight:700;box-shadow:0 8px 30px #0004;transition:.25s}.toast.ver{transform:translateX(-50%) translateY(0)}@media(max-width:800px){.ruta{grid-template-columns:1fr}.evtop{display:block}.est{margin-top:10px}.up{display:block}}
</style></head><body><div class="toast" id="toast">ARCHIVO SUBIDO CORRECTAMENTE</div><div class="head"><b>PORTAL PERSONAL Rita©</b><span>SERVICIO DE CERTIFICACIÓN DE PERSONAS · Instituto de Acompañamiento de la UFV</span></div><main class="main"><div class="card" id="carga">Accediendo a su expediente...</div><div id="contenido" class="hide"><div class="card"><h1 id="nombre"></h1><div class="dato" id="datos"></div><div class="ruta"><button class="paso" id="p1">LLAVE 1<br>ADMISIÓN</button><button class="paso" id="p2">LLAVE 2<br>CUALIFICACIÓN</button><button class="paso" id="p3">LLAVE 3<br>EVALUACIÓN</button><button class="paso" id="p4">DECISIÓN</button><button class="paso" id="p5">CERTIFICACIÓN</button></div><a id="pdf" class="pdf hide" target="_blank">DESCARGAR INSTRUCCIONES</a><div id="estadoProceso"></div></div><div class="card"><h2 id="tituloReq">Mis requisitos</h2><div id="evidencias"></div></div></div></main><iframe id="x" src="q7m2x9v4.html" style="display:none"></iframe><script>
const $=x=>document.getElementById(x),token=new URLSearchParams(location.search).get("t")||"",x=$("x");let ready=false,DATA=null,LLAVE="ADMISION";const MID=()=>crypto.getRandomValues(new Uint32Array(2)).join("");
function ask(tipo,data={},timeout=90000){return new Promise((ok,no)=>{if(!ready)return no(Error("Sistema no disponible"));const id=MID(),tm=setTimeout(()=>{removeEventListener("message",h);no(Error("Sin respuesta del sistema"))},timeout);function h(e){if(e.origin!==location.origin||e.data?.id!==id)return;clearTimeout(tm);removeEventListener("message",h);e.data.ok?ok(e.data):no(Error(e.data.error||"Error"))}addEventListener("message",h);x.contentWindow.postMessage({tipo,id,...data},location.origin)})}
function toast(){const t=$("toast");t.classList.add("ver");setTimeout(()=>t.classList.remove("ver"),2600)}
function fase(e){const l=String(e.llave_actual||"").toUpperCase(),f=String(e.fase||"").toUpperCase(),s=String(e.estado||"").toUpperCase(),c=String(e.estado_certificacion||"").toUpperCase();if(l==="CERTIFICACION"||f.includes("CERTIFIC")||c==="PENDIENTE_EMISION"||e.numero_certificado)return"CERTIFICACION";if(l==="DECISION"||f.includes("DECISI")||s.includes("DECISI")||s==="PENDIENTE DE DECISIÓN")return"DECISION";if(l==="EVALUACION"||f.includes("LLAVE 3")||f.includes("EVALU"))return"EVALUACION";if(l==="CUALIFICACION"||f.includes("LLAVE 2")||f.includes("CUALIFIC"))return"CUALIFICACION";return"ADMISION"}
function llaves(e){const f=fase(e),orden=["ADMISION","CUALIFICACION","EVALUACION","DECISION","CERTIFICACION"],ids=["p1","p2","p3","p4","p5"],n=orden.indexOf(f);ids.forEach((id,i)=>$(id).className="paso "+(i<n?"ok":i===n?"on":"lock"));ids.forEach(id=>$(id).classList.remove("sel"));const mapa={ADMISION:"p1",CUALIFICACION:"p2",EVALUACION:"p3",DECISION:"p4",CERTIFICACION:"p5"};if(mapa[LLAVE])$(mapa[LLAVE]).classList.add("sel")}
function proceso(e){const f=fase(e),d=$("estadoProceso");if(f==="DECISION"){const desf=String(e.estado||"").toUpperCase().includes("DESFAVORABLE"),fav=String(e.estado||"").toUpperCase().includes("FAVORABLE");d.innerHTML=`<div class="estado-proceso"><strong>FASE DE DECISIÓN</strong><p>${e.estado==="PENDIENTE DE DECISIÓN"?"Su evaluación ha finalizado y su expediente está pendiente de una decisión de certificación independiente.":e.estado||"Su expediente se encuentra en fase de decisión."}</p>${fav||desf?`<div class="decision ${fav?"favorable":"desfavorable"}"><b>${fav?"DECISIÓN FAVORABLE":"DECISIÓN DESFAVORABLE"}</b>${e.decision_porque?`<div class="porque"><b>POR QUÉ:</b><br>${e.decision_porque}</div>`:""}${e.decision_texto_solicitante?`<div class="porque"><b>Información para usted:</b><br>${e.decision_texto_solicitante}</div>`:""}</div>`:""}</div>`}else if(f==="CERTIFICACION"){d.innerHTML=`<div class="estado-proceso"><strong>FASE DE CERTIFICACIÓN</strong><p>${e.numero_certificado?"Su certificado ha sido emitido. Número: "+e.numero_certificado:"La decisión ha sido favorable y su certificado está pendiente de emisión."}</p></div>`}else if(f==="EVALUACION")d.innerHTML='<div class="estado-proceso"><strong>FASE DE EVALUACIÓN</strong><p>Su expediente está siendo evaluado.</p></div>';else d.innerHTML=""}
function render(){if(!DATA)return;const e=DATA.expediente;$("nombre").textContent=e.nombre_completo;$("datos").innerHTML=`<b>EXPEDIENTE:</b> ${e.codigo}<br><b>ESQUEMA:</b> ${e.esquema_nombre}<br><b>ESTADO:</b> ${e.estado}<br><b>FASE:</b> ${e.fase}`;const f=fase(e);if(!["ADMISION","CUALIFICACION","EVALUACION"].includes(LLAVE))LLAVE=f;llaves(e);proceso(e);if(DATA.pdf){$("pdf").href=DATA.pdf;$("pdf").classList.remove("hide")}const lista=DATA.evidencias.filter(v=>v.nivel_llave===LLAVE);$("tituloReq").textContent=LLAVE==="ADMISION"?"Mis requisitos · LLAVE 1 · ADMISIÓN":LLAVE==="CUALIFICACION"?"Mis requisitos · LLAVE 2 · CUALIFICACIÓN":LLAVE==="EVALUACION"?"Mis requisitos · LLAVE 3 · EVALUACIÓN":LLAVE==="DECISION"?"Mi expediente · DECISIÓN":"Mi expediente · CERTIFICACIÓN";if(!["ADMISION","CUALIFICACION","EVALUACION"].includes(LLAVE)){$("evidencias").innerHTML='<div class="sin">En esta fase no debe aportar nuevas evidencias.</div>';return}$("evidencias").innerHTML=lista.length?lista.map(v=>`<div class="ev"><div class="evtop"><div><span class="tipo">${v.tipo_requisito} · ${v.codigo_requisito}</span><h2>${v.titulo}</h2></div><span class="est ${v.estado}">${v.estado.replaceAll("_"," ")}</span></div><div>${v.descripcion||""}</div><div class="met"><b>Método de comprobación:</b> ${v.metodo_comprobacion||"No especificado"}</div>${v.motivo_insuficiente?`<div class="err"><b>Motivo:</b> ${v.motivo_insuficiente}</div>`:""}${["SIN_EVIDENCIA","INSUFICIENTE"].includes(v.estado)?`<div class="up" data-codigo="${v.codigo}"><input class="archivo" type="file"><button class="btn subir" type="button" disabled>SUBIR EVIDENCIA</button><span class="nomarchivo">Seleccione un archivo</span></div>`:""}</div>`).join(""):'<div class="sin">No hay requisitos disponibles en esta fase.</div>';document.querySelectorAll(".up").forEach(z=>{const inp=z.querySelector(".archivo"),btn=z.querySelector(".subir"),nom=z.querySelector(".nomarchivo"),codigo=z.dataset.codigo;inp.onchange=()=>{const f=inp.files?.[0];nom.textContent=f?f.name:"Seleccione un archivo";btn.disabled=!f};btn.onclick=async()=>{const f=inp.files?.[0];if(!f)return;btn.disabled=true;btn.textContent="SUBIENDO...";try{await ask("RITA_APORTAR_EVIDENCIA",{token,evidencia_codigo:codigo,archivo:f},120000);toast();await load()}catch(err){alert(err.message);btn.disabled=false;btn.textContent="SUBIR EVIDENCIA"}}})}
async function load(){try{DATA=await ask("RITA_PORTAL",{token});$("carga").classList.add("hide");$("contenido").classList.remove("hide");const f=fase(DATA.expediente);if(f==="DECISION")LLAVE="DECISION";else if(f==="CERTIFICACION")LLAVE="CERTIFICACION";else if(LLAVE==="ADMISION"&&f!=="ADMISION")LLAVE=f;render()}catch(e){$("carga").innerHTML='<span class="err">'+e.message+"</span>"}}
$("p1").onclick=()=>{LLAVE="ADMISION";render()};$("p2").onclick=()=>{if(["ADMISION"].includes(fase(DATA.expediente)))return;LLAVE="CUALIFICACION";render()};$("p3").onclick=()=>{if(["ADMISION","CUALIFICACION"].includes(fase(DATA.expediente)))return;LLAVE="EVALUACION";render()};$("p4").onclick=()=>{if(["DECISION","CERTIFICACION"].includes(fase(DATA.expediente))){LLAVE="DECISION";render()}};$("p5").onclick=()=>{if(fase(DATA.expediente)==="CERTIFICACION"){LLAVE="CERTIFICACION";render()}};x.onload=()=>{ready=true;if(!token)$("carga").innerHTML='<span class="err">Falta el acceso personal.</span>';else load()};
</script></body></html>
