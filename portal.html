<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rita© | Portal personal</title>
<style>
@font-face{font-family:T;src:url("tecnico_regular.ttf")}@font-face{font-family:T;src:url("tecnico_bold.ttf");font-weight:700}*{box-sizing:border-box}body{margin:0;background:#edf5fb;color:#17344e;font:22px T,Arial}.head{background:#003B5D;color:#fff;padding:28px 5%}.head b{font-size:38px}.head span{display:block;color:#cfe4ef;margin-top:5px}.main{max-width:1200px;margin:auto;padding:28px}.card{background:#fff;border:2px solid #cad9e3;border-radius:9px;padding:24px;margin-bottom:18px}h1,h2{font-weight:400;margin:0 0 12px}.ruta{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:20px 0}.paso{padding:14px 6px;text-align:center;border-radius:6px;background:#e5e9ec;color:#758692;font-size:18px}.paso.on{background:#d9eef5;color:#1c6488}.paso.ok{background:#d9efdf;color:#2d7952}.dato{font-size:20px;line-height:1.5}.ev{border:2px solid #d7e2e9;border-radius:7px;padding:17px;margin:12px 0}.evtop{display:flex;justify-content:space-between;gap:15px}.tipo{color:#617f95;font-weight:700}.est{padding:7px 12px;border-radius:18px;font-size:17px}.SIN_EVIDENCIA,.INSUFICIENTE{background:#f4c6c6;color:#8f2828}.PENDIENTE_VALIDACION{background:#f6e79b;color:#756000}.VALIDADA{background:#cdebd8;color:#276a46}.BLOQUEADA{background:#e5e8ea;color:#6a7379}.met{font-size:18px;color:#6c8293}.up{margin-top:12px;padding-top:12px;border-top:1px solid #dde6eb}.up input{font:18px T}.btn{border:0;border-radius:6px;background:#0873ae;color:#fff;padding:11px 16px;font:19px T;cursor:pointer}.btn:disabled{opacity:.35}.pdf{display:inline-block;text-decoration:none;background:#003B5D;color:#fff;padding:11px 16px;border-radius:6px}.err{color:#a33d3d}.hide{display:none}@media(max-width:800px){.ruta{grid-template-columns:1fr}.evtop{display:block}}
</style></head><body>
<div class="head"><b>PORTAL PERSONAL Rita©</b><span>SERVICIO DE CERTIFICACIÓN DE PERSONAS · Instituto de Acompañamiento de la UFV</span></div>
<main class="main"><div class="card" id="carga">Accediendo a su expediente...</div><div id="contenido" class="hide">
<div class="card"><h1 id="nombre"></h1><div class="dato" id="datos"></div><div class="ruta"><div class="paso" id="p1">LLAVE 1<br>ADMISIÓN</div><div class="paso" id="p2">LLAVE 2<br>CUALIFICACIÓN</div><div class="paso" id="p3">LLAVE 3<br>EVALUACIÓN</div><div class="paso" id="p4">DECISIÓN</div><div class="paso" id="p5">CERTIFICACIÓN</div></div><a id="pdf" class="pdf hide" target="_blank">DESCARGAR INSTRUCCIONES</a></div>
<div class="card"><h2>Mis requisitos</h2><div id="evidencias"></div></div></div></main>
<iframe id="x" src="q7m2x9v4.html" style="display:none"></iframe>
<script>
const $=x=>document.getElementById(x),token=new URLSearchParams(location.search).get("t")||"",x=$("x");let ready=false;
const id=()=>crypto.getRandomValues(new Uint32Array(2)).join("");
function ask(tipo,data={},timeout=30000){return new Promise((ok,no)=>{if(!ready)return no(Error("Sistema no disponible"));const i=id(),tm=setTimeout(()=>{removeEventListener("message",h);no(Error("Sin respuesta del sistema"))},timeout);function h(e){if(e.origin!==location.origin||e.data?.id!==i)return;clearTimeout(tm);removeEventListener("message",h);e.data.ok?ok(e.data):no(Error(e.data.error||"Error"))}addEventListener("message",h);x.contentWindow.postMessage({tipo,id:i,...data},location.origin)})}
async function load(){try{const r=await ask("RITA_PORTAL",{token});$("carga").classList.add("hide");$("contenido").classList.remove("hide");const e=r.expediente;$("nombre").textContent=e.nombre_completo;$("datos").innerHTML=`<b>EXPEDIENTE:</b> ${e.codigo}<br><b>ESQUEMA:</b> ${e.esquema_nombre}<br><b>ESTADO:</b> ${e.estado}<br><b>FASE:</b> ${e.fase}`;if(r.pdf){$("pdf").href=r.pdf;$("pdf").classList.remove("hide")}const l=e.llave_actual;["p1","p2","p3","p4","p5"].forEach(z=>$(z).className="paso");$("p1").classList.add(l==="ADMISION"?"on":"ok");if(l==="CUALIFICACION"){$("p2").classList.add("on");$("p1").classList.add("ok")}if(l==="EVALUACION"){$("p1").classList.add("ok");$("p2").classList.add("ok");$("p3").classList.add("on")}
$("evidencias").innerHTML=r.evidencias.map(v=>`<div class="ev"><div class="evtop"><div><span class="tipo">${v.tipo_requisito} · ${v.codigo_requisito}</span><h2>${v.titulo}</h2></div><span class="est ${v.estado}">${v.estado.replaceAll("_"," ")}</span></div><div>${v.descripcion||""}</div><div class="met"><b>Método de comprobación:</b> ${v.metodo_comprobacion||"No especificado"}</div>${v.motivo_insuficiente?`<div class="err"><b>Motivo:</b> ${v.motivo_insuficiente}</div>`:""}${["SIN_EVIDENCIA","INSUFICIENTE"].includes(v.estado)?`<div class="up"><input type="file" id="f-${v.codigo}"> <button class="btn" onclick="subir('${v.codigo}')">SUBIR EVIDENCIA</button></div>`:""}</div>`).join("")||"No hay requisitos disponibles."; }catch(e){$("carga").innerHTML='<span class="err">'+e.message+"</span>"}}
async function subir(c){const f=$("f-"+c).files[0];if(!f)return alert("Seleccione un archivo.");try{await ask("RITA_APORTAR_EVIDENCIA",{token,evidencia_codigo:c,archivo:f},60000);await load()}catch(e){alert(e.message)}}
x.onload=()=>{ready=true;if(!token)$("carga").innerHTML='<span class="err">Falta el acceso personal.</span>';else load()};
</script></body></html>
