<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="robots" content="noindex,nofollow,noarchive"><title></title></head><body>
<script src="dropbox_config.js"></script><script>
(()=>{const B="/03_UFV_INSTITUTO/99_datos_Rita/",F={sol:B+"maestro_solicitudes.json",exp:B+"maestro_expedientes.json",evi:B+"maestro_evidencias.json",per:B+"maestro_perfiles_certificables.json",esq:B+"maestro_esquemas_certificacion.json"},PDF="/03_UFV_INSTITUTO/01_Documentación del sistema/Varios/Rita_Instrucciones_Solicitante_BORRADOR.pdf",ASP="/03_UFV_INSTITUTO/03_Aspirantes";
const s=(v,n=500)=>String(v??"").trim().slice(0,n),now=()=>new Date().toISOString(),doc=v=>s(v,50).toUpperCase().replace(/\s+/g,"");
function tok(){const a=new Uint8Array(32);crypto.getRandomValues(a);return[...a].map(x=>x.toString(16).padStart(2,"0")).join("")}
function cod(a,p){let n=0;(a||[]).forEach(x=>{const m=String(x.codigo||"").match(new RegExp("^"+p+"-(\\d+)$"));if(m)n=Math.max(n,+m[1])});return p+"-"+String(n+1).padStart(5,"0")}
async function T(){return obtenerDropboxAccessToken()}
async function read(path){const t=await T(),r=await fetch("https://content.dropboxapi.com/2/files/download",{method:"POST",headers:{Authorization:"Bearer "+t,"Dropbox-API-Arg":JSON.stringify({path})}});if(r.status===404||r.status===409)return{d:[],rev:null};if(!r.ok)throw Error("No se puede leer "+path);let m={};try{m=JSON.parse(r.headers.get("Dropbox-API-Result")||"{}")}catch{}const x=await r.text();if(!x.trim())return{d:[],rev:m.rev||null};const d=JSON.parse(x);if(!Array.isArray(d))throw Error("Maestro no válido: "+path);return{d,rev:m.rev||null}}
async function write(path,d,rev){const t=await T(),r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path,mode:rev?{".tag":"update",update:rev}:"overwrite",autorename:false,mute:true,strict_conflict:true})},body:JSON.stringify(d,null,2)});if(r.status===409)throw Error("CONFLICTO");if(!r.ok)throw Error("No se puede guardar "+path);return r.json()}
async function folder(path){const t=await T();let r=await fetch("https://api.dropboxapi.com/2/files/get_metadata",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({path})});if(r.ok)return;r=await fetch("https://api.dropboxapi.com/2/files/create_folder_v2",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({path,autorename:false})});if(!r.ok&&r.status!==409)throw Error("No se puede crear carpeta de expediente")}
function safe(n){return s(n,160).replace(/[\/\\:*?"<>|]/g,"_")}
async function upload(path,file){const t=await T(),r=await fetch("https://content.dropboxapi.com/2/files/upload",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/octet-stream","Dropbox-API-Arg":JSON.stringify({path,mode:"overwrite",autorename:false,mute:true})},body:file});if(!r.ok)throw Error("No se ha podido subir la evidencia");return r.json()}
async function temp(path){const t=await T(),r=await fetch("https://api.dropboxapi.com/2/files/get_temporary_link",{method:"POST",headers:{Authorization:"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({path})});if(!r.ok)return"";return(await r.json()).link||""}
const usable=e=>e.activo!==false&&!["INACTIVO","OBSOLETO","RETIRADO"].includes(String(e.estado||"").toUpperCase());
function req(p){const r=p?.requisitos||{};return[...(r.educacion||[]).map(x=>({...x,tipo_requisito:"EDUCACIÓN"})),...(r.formacion||[]).map(x=>({...x,tipo_requisito:"FORMACIÓN"})),...(r.experiencia||[]).map(x=>({...x,tipo_requisito:"EXPERIENCIA"})),...(r.otros||[]).map(x=>({...x,tipo_requisito:"OTROS"}))]}
async function catalog(){const[a,b]=await Promise.all([read(F.esq),read(F.per)]);return a.d.filter(usable).map(e=>{const pc=e.perfil_codigo||e.codigo_perfil||"",p=b.d.find(x=>x.codigo===pc);return{codigo:e.codigo,nombre:e.nombre||e.denominacion||e.codigo,perfil_codigo:pc,perfil_nombre:p?.nombre||""}}).filter(x=>x.codigo&&x.perfil_codigo)}
function valid(d){if(!d||typeof d!=="object")throw Error("Solicitud no válida");for(const[c,n]of[["esquema_codigo","Esquema"],["nombre","Nombre"],["primer_apellido","Primer apellido"],["documento_tipo","Documento"],["documento","Documento"],["fecha_nacimiento","Fecha de nacimiento"],["email","Correo"],["telefono","Teléfono"]])if(!s(d[c]))throw Error("Falta: "+n);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s(d.email)))throw Error("Correo no válido");if(!d.proteccion_datos||!d.comunicaciones_proceso)throw Error("Debe aceptar las condiciones")}
async function alta(d,int=0){valid(d);const[ms,mx,mv,mp,me]=await Promise.all([read(F.sol),read(F.exp),read(F.evi),read(F.per),read(F.esq)]),es=me.d.find(x=>x.codigo===d.esquema_codigo&&usable(x));if(!es)throw Error("Esquema no disponible");const pc=es.perfil_codigo||es.codigo_perfil||d.perfil_codigo,p=mp.d.find(x=>x.codigo===pc);if(!p)throw Error("Perfil no localizado");const dd=doc(d.documento),dup=ms.d.find(x=>doc(x.documento)===dd&&x.esquema_codigo===es.codigo&&!["CANCELADA","CERRADA","ANULADA"].includes(String(x.estado||"").toUpperCase()));if(dup)return{ok:true,duplicada:true,codigo:dup.codigo,expediente_codigo:dup.expediente_codigo,estado:"ASPIRANTE",token_portal:dup.token_portal};
const cs=cod(ms.d,"SOL"),ce=cod(mx.d,"EXP"),tk=tok(),n=now(),nombre=[s(d.nombre,150),s(d.primer_apellido,150),s(d.segundo_apellido,150)].filter(Boolean).join(" ");
const sol={codigo:cs,fecha_solicitud:n,fecha_actualizacion:n,estado:"EXPEDIENTE CREADO",esquema_codigo:es.codigo,esquema_nombre:es.nombre||es.denominacion||es.codigo,perfil_codigo:p.codigo,perfil_nombre:p.nombre||"",nombre:s(d.nombre,150),primer_apellido:s(d.primer_apellido,150),segundo_apellido:s(d.segundo_apellido,150),nombre_completo:nombre,documento_tipo:s(d.documento_tipo,50),documento:dd,fecha_nacimiento:s(d.fecha_nacimiento,20),email:s(d.email,200).toLowerCase(),telefono:s(d.telefono,50),direccion:s(d.direccion,300),codigo_postal:s(d.codigo_postal,20),poblacion:s(d.poblacion,150),provincia:s(d.provincia,150),pais:s(d.pais,100),proteccion_datos:true,comunicaciones_proceso:true,token_portal:tk,portal_activo:true,pdf_instrucciones:PDF,expediente_codigo:ce,fecha_procesada:n,origen:"SOLICITUD_PUBLICA"};
const exp={codigo:ce,solicitud_codigo:cs,fecha_alta:n,fecha_actualizacion:n,nombre_completo:nombre,documento_tipo:sol.documento_tipo,documento:dd,fecha_nacimiento:sol.fecha_nacimiento,email:sol.email,telefono:sol.telefono,esquema_codigo:sol.esquema_codigo,esquema_nombre:sol.esquema_nombre,perfil_codigo:p.codigo,perfil_nombre:p.nombre||"",estado:"ASPIRANTE",fase:"LLAVE 1 · ADMISIÓN",llave_actual:"ADMISION",token_portal:tk,portal_activo:true,numero_certificado:null,estado_certificacion:null};
const ne=[];req(p).forEach(r=>{const l=String(r.nivel_llave||"").toUpperCase();if(!["ADMISION","CUALIFICACION"].includes(l))return;ne.push({codigo:cod([...mv.d,...ne],"EVI"),expediente_codigo:ce,solicitud_codigo:cs,codigo_requisito:r.codigo_requisito||"",tipo_requisito:r.tipo_requisito,titulo:r.titulo||r.denominacion||r.nombre||"",descripcion:r.descripcion||"",metodo_comprobacion:r.metodo_comprobacion||"",nivel_llave:l,obligatoriedad:r.obligatoriedad||"OBLIGATORIO",grupo_alternativa:r.grupo_alternativa||"",estado:l==="ADMISION"?"SIN_EVIDENCIA":"BLOQUEADA",archivo:null,fecha_aportacion:null,fecha_validacion:null,validado_por:null,motivo_insuficiente:"",fecha_creacion:n})});
ms.d.push(sol);mx.d.push(exp);mv.d.push(...ne);try{await write(F.evi,mv.d,mv.rev);await write(F.exp,mx.d,mx.rev);await write(F.sol,ms.d,ms.rev)}catch(e){if(e.message==="CONFLICTO"&&int<2)return alta(d,int+1);throw e}return{ok:true,codigo:cs,expediente_codigo:ce,estado:"ASPIRANTE",fase:exp.fase,token_portal:tk}}
async function portal(tk){const[mx,mv]=await Promise.all([read(F.exp),read(F.evi)]),e=mx.d.find(x=>x.token_portal===tk&&x.portal_activo!==false);if(!e)throw Error("Acceso personal no válido");const ev=mv.d.filter(x=>x.expediente_codigo===e.codigo),pdf=await temp(PDF);return{expediente:{codigo:e.codigo,nombre_completo:e.nombre_completo,esquema_nombre:e.esquema_nombre,estado:e.estado,fase:e.fase,llave_actual:e.llave_actual,numero_certificado:e.numero_certificado,estado_certificacion:e.estado_certificacion},evidencias:ev.map(x=>({codigo:x.codigo,codigo_requisito:x.codigo_requisito,tipo_requisito:x.tipo_requisito,titulo:x.titulo,descripcion:x.descripcion,metodo_comprobacion:x.metodo_comprobacion,nivel_llave:x.nivel_llave,estado:x.estado,motivo_insuficiente:x.motivo_insuficiente||"",fecha_aportacion:x.fecha_aportacion})),pdf}}
async function aporta(tk,id,file){const[mx,mv]=await Promise.all([read(F.exp),read(F.evi)]),e=mx.d.find(x=>x.token_portal===tk&&x.portal_activo!==false);if(!e)throw Error("Acceso no válido");const v=mv.d.find(x=>x.codigo===id&&x.expediente_codigo===e.codigo);if(!v)throw Error("Requisito no localizado");if(v.nivel_llave!=="ADMISION"&&v.estado==="BLOQUEADA")throw Error("Esta fase todavía está bloqueada");if(!file||!file.name)throw Error("Seleccione un archivo");const dir=ASP+"/"+e.codigo;await folder(dir);const path=dir+"/"+v.codigo+"_"+safe(file.name);await upload(path,file);v.archivo=path;v.estado="PENDIENTE_VALIDACION";v.fecha_aportacion=now();v.fecha_validacion=null;v.validado_por=null;v.motivo_insuficiente="";await write(F.evi,mv.d,mv.rev);return{ok:true,estado:v.estado}}
function reply(e,id,tipo,x){e.source.postMessage({tipo,id,...x},e.origin)}
window.addEventListener("message",async e=>{if(e.origin!==location.origin||!e.data)return;const q=e.data,id=q.id;try{
if(q.tipo==="RITA_CATALOGO_ESQUEMAS")return reply(e,id,"RITA_CATALOGO_ESQUEMAS_RESPUESTA",{ok:true,esquemas:await catalog()});
if(q.tipo==="RITA_SOLICITUD")return reply(e,id,"RITA_SOLICITUD_RESPUESTA",await alta(q.solicitud||{}));
if(q.tipo==="RITA_PORTAL")return reply(e,id,"RITA_PORTAL_RESPUESTA",{ok:true,...await portal(q.token)});
if(q.tipo==="RITA_APORTAR_EVIDENCIA")return reply(e,id,"RITA_APORTAR_EVIDENCIA_RESPUESTA",await aporta(q.token,q.evidencia_codigo,q.archivo));
}catch(err){console.error(err);const tipo=q.tipo==="RITA_PORTAL"?"RITA_PORTAL_RESPUESTA":q.tipo==="RITA_APORTAR_EVIDENCIA"?"RITA_APORTAR_EVIDENCIA_RESPUESTA":q.tipo==="RITA_CATALOGO_ESQUEMAS"?"RITA_CATALOGO_ESQUEMAS_RESPUESTA":"RITA_SOLICITUD_RESPUESTA";reply(e,id,tipo,{ok:false,error:err.message||"Error del sistema"})}})})();
</script></body></html>
