const usable=e=>e.activo!==false&&!["INACTIVO","OBSOLETO","RETIRADO"].includes(String(e.estado||"").toUpperCase());
function req(p){const r=p?.requisitos||{};return[...(r.educacion||[]).map(x=>({...x,tipo_requisito:"EDUCACIÓN"})),...(r.formacion||[]).map(x=>({...x,tipo_requisito:"FORMACIÓN"})),...(r.experiencia||[]).map(x=>({...x,tipo_requisito:"EXPERIENCIA"})),...(r.otros||[]).map(x=>({...x,tipo_requisito:"OTROS"}))]}

function valid(d){for(const[c,n]of[["esquema_codigo","Esquema"],["nombre","Nombre"],["primer_apellido","Primer apellido"],["documento_tipo","Documento"],["documento","Documento"],["fecha_nacimiento","Fecha de nacimiento"],["email","Correo"],["telefono","Teléfono"]])if(!S(d?.[c]))throw Error("Falta: "+n);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S(d.email)))throw Error("Correo no válido");if(!d.proteccion_datos||!d.comunicaciones_proceso)throw Error("Debe aceptar las condiciones")}
async function alta(d,i=0){valid(d);const[ms,mx,mv,mp,me]=await Promise.all([read(F.sol),read(F.exp),read(F.evi),read(F.per),read(F.esq)]),es=me.d.find(x=>x.codigo===d.esquema_codigo&&usable(x));if(!es)throw Error("Esquema no disponible");const pc=es.perfil_codigo||es.codigo_perfil||d.perfil_codigo,p=mp.d.find(x=>x.codigo===pc);if(!p)throw Error("Perfil no localizado");const dd=D(d.documento),dup=ms.d.find(x=>D(x.documento)===dd&&x.esquema_codigo===es.codigo&&!["CANCELADA","CERRADA","ANULADA"].includes(String(x.estado||"").toUpperCase()));if(dup)return{ok:true,duplicada:true,codigo:dup.codigo,expediente_codigo:dup.expediente_codigo,estado:"ASPIRANTE",fase:"LLAVE 1 · ADMISIÓN",token_portal:dup.token_portal,pdf_instrucciones:await temp(PDF)};

const sol={codigo:cs,fecha_solicitud:n,fecha_actualizacion:n,estado:"EXPEDIENTE CREADO",esquema_codigo:es.codigo,esquema_nombre:es.nombre||es.denominacion||es.codigo,perfil_codigo:p.codigo,perfil_nombre:p.nombre||"",nombre:S(d.nombre,150),primer_apellido:S(d.primer_apellido,150),segundo_apellido:S(d.segundo_apellido,150),nombre_completo:nombre,documento_tipo:S(d.documento_tipo,50),documento:dd,fecha_nacimiento:S(d.fecha_nacimiento,20),email:S(d.email,200).toLowerCase(),telefono:S(d.telefono,50),direccion:S(d.direccion,300),codigo_postal:S(d.codigo_postal,20),poblacion:S(d.poblacion,150),provincia:S(d.provincia,150),pais:S(d.pais,100),proteccion_datos:true,comunicaciones_proceso:true,token_portal:tk,portal_activo:true,pdf_instrucciones:PDF,expediente_codigo:ce,fecha_procesada:n,origen:"SOLICITUD_PUBLICA"};

async function portal(tk){const[mx,mv]=await Promise.all([read(F.exp),read(F.evi)]),e=mx.d.find(x=>x.token_portal===tk&&x.portal_activo!==false);if(!e)throw Error("Acceso personal no válido");return{ok:true,expediente:{codigo:e.codigo,nombre_completo:e.nombre_completo,esquema_nombre:e.esquema_nombre,estado:e.estado,fase:e.fase,llave_actual:e.llave_actual,numero_certificado:e.numero_certificado,estado_certificacion:e.estado_certificacion},evidencias:mv.d.filter(x=>x.expediente_codigo===e.codigo).map(v=>({codigo:v.codigo,codigo_requisito:v.codigo_requisito,tipo_requisito:v.tipo_requisito,titulo:v.titulo,descripcion:v.descripcion,metodo_comprobacion:v.metodo_comprobacion,nivel_llave:v.nivel_llave,estado:v.estado,motivo_insuficiente:v.motivo_insuficiente||"",fecha_aportacion:v.fecha_aportacion})),pdf:await temp(PDF)}}
