<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rita© | A1 Área Técnica</title>

<style>
@font-face{font-family:Tecnico;src:url("tecnico_regular.ttf") format("truetype");font-weight:400}
@font-face{font-family:Tecnico;src:url("tecnico_bold.ttf") format("truetype");font-weight:700}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{min-height:100vh;background:#edf5fb;color:#17344e;font-family:Tecnico,Arial,sans-serif}
.app{display:flex;min-height:100vh}

/* LATERAL */
.lateral{width:330px;min-width:330px;min-height:100vh;background:#003B5D;color:#fff;padding:38px 34px 30px;display:flex;flex-direction:column}
.rita{position:relative;width:max-content;font-size:82px;line-height:.95;letter-spacing:-4px}
.copyright{position:absolute;top:-5px;right:-22px;font:20px Arial}
.linea-rita{width:92px;height:5px;background:#4dd4d0;margin:35px 0 40px}
.nombre-sistema{width:250px;font-size:25px;line-height:1.28;letter-spacing:1.5px;text-transform:uppercase}

.menu{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,.22)}
.menu-btn{width:100%;min-height:52px;margin-bottom:8px;padding:8px 11px;border:1px solid rgba(255,255,255,.28);border-radius:5px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;gap:10px;text-align:left;font-family:Tecnico;cursor:pointer}
.menu-btn.inactivo{opacity:.28;filter:grayscale(1);cursor:not-allowed}
.menu-btn.actual{background:#fff;color:#003B5D;border-color:#fff}
.menu-codigo{width:35px;font-size:18px;font-weight:700;color:#59d8d5}
.menu-btn.actual .menu-codigo{color:#003B5D}
.menu-texto{font-size:15px;line-height:1.1;text-transform:uppercase}
.pie-lateral{margin-top:auto;padding:30px 0 95px;display:flex;justify-content:center}
.pie-lateral img{display:block;width:382px;max-width:100%;height:auto}

/* PRINCIPAL */
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.cabecera{height:185px;min-height:185px;background:#fff;display:flex;align-items:center;padding:0 75px}
.cabecera img{display:block;width:844px;max-width:72vw;height:auto}
.zona{flex:1;padding:34px 42px 55px;background:#edf5fb}

/* CABECERA A1 */
.area-head{display:flex;justify-content:space-between;align-items:flex-start;gap:25px;margin-bottom:22px}
.area-identidad{display:flex;align-items:center;gap:20px}
.area-icono{width:105px;height:105px;object-fit:contain;border-radius:14px}
.area-titulo h1{margin:0;font-size:46px;font-weight:400}
.area-titulo p{margin:6px 0 0;color:#718ca4;font-size:20px}
.usuario{text-align:right;color:#718ca4;font-size:17px}
.usuario strong{display:block;color:#17344e;font-size:22px}
.volver{margin-top:10px;padding:10px 17px;border:1px solid #b9cbd8;border-radius:5px;background:#fff;color:#315675;font:16px Tecnico;cursor:pointer}

/* FUNCIONES A1 */
.funciones{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.funcion{padding:14px 22px;border:1px solid #bdd0dc;border-radius:6px;background:#fff;color:#45647d;font:17px Tecnico;cursor:pointer}
.funcion.activa{background:#0873ae;color:#fff;border-color:#0873ae}

/* CONTENEDOR */
.panel{background:#fff;border:1px solid #cbd9e3;border-radius:8px;padding:26px 28px 32px}
.panel h2{margin:0 0 5px;font-size:31px;font-weight:400}
.intro{margin:0 0 22px;color:#718ca4;font-size:18px}

/* PERFILES */
.barra{display:flex;gap:12px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
.barra select,.barra input{height:48px;border:1px solid #bfd0dc;border-radius:5px;background:#fff;color:#17344e;padding:0 13px;font:17px Tecnico}
.barra select{min-width:340px}
.btn{border:0;border-radius:5px;padding:12px 19px;font:16px Tecnico;cursor:pointer}
.btn-azul{background:#0873ae;color:#fff}
.btn-claro{background:#e9f1f6;color:#315675}
.btn-verde{background:#378b62;color:#fff}
.btn-rojo{background:#b34c4c;color:#fff}

/* PESTAÑAS PERFIL */
.tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #bacdda;margin-top:10px}
.tab{padding:12px 16px;border:1px solid #c7d6e0;border-bottom:0;border-radius:6px 6px 0 0;background:#f7fafc;color:#4e6b84;font:15px Tecnico;cursor:pointer}
.tab.activa{background:#0873ae;color:#fff;border-color:#0873ae}
.subpanel{display:none;border:1px solid #cddae4;border-top:0;padding:24px;background:#fff}
.subpanel.activo{display:block}

/* CAMPOS */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:17px 24px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo.ancho{grid-column:1/-1}
.campo label{font-size:14px;font-weight:700;color:#58738c;text-transform:uppercase;letter-spacing:.5px}
.campo input,.campo select,.campo textarea{width:100%;border:1px solid #bfd0dc;border-radius:5px;background:#fff;color:#17344e;font:17px Tecnico;padding:11px 13px;outline:none}
.campo input,.campo select{height:48px}
.campo textarea{min-height:105px;resize:vertical}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:#1684b5}

/* LISTAS */
.bloque{border:1px solid #d5e0e7;border-radius:7px;padding:18px;margin-bottom:14px;background:#fbfdfe}
.bloque h3{margin:0 0 10px;font-size:20px;font-weight:400;color:#274b67}
.bloque .meta{font-size:14px;color:#71879a;margin-top:6px}
.lista-vacia{padding:20px;color:#8092a1;text-align:center;border:1px dashed #cbd8e1;border-radius:6px}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}

/* RIESGO */
.riesgo-ok{border-left:6px solid #399168}
.riesgo-no{border-left:6px solid #c54f4f}
.nivel{font-weight:700}
.estado-aprobado{display:inline-block;padding:6px 12px;border-radius:15px;background:#d8f0e3;color:#28724c;font-size:14px}
.estado-borrador{display:inline-block;padding:6px 12px;border-radius:15px;background:#f1e9cf;color:#8a6a15;font-size:14px}

/* MENSAJES */
.mensaje{display:none;margin-top:14px;padding:11px 14px;border-radius:5px;background:#e5f3e9;color:#2b6944;font-size:15px}
.mensaje.visible{display:block}

@media(max-width:1200px){
.lateral{width:285px;min-width:285px}.cabecera{height:160px;min-height:160px;padding:0 55px}.cabecera img{width:730px}
.grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
let perfil=null;

const sesion=usuarioActivo();
if(!sesion||!tienePermiso("A1")){
alert("No dispone de autorización para acceder al Área Técnica.");
location.href="index.html";
}

document.getElementById("usuarioCabecera").textContent=sesion?.nombre||"";
document.getElementById("rolCabecera").textContent=sesion?.rol||"";

document.querySelectorAll(".menu-btn").forEach(b=>{
const ok=tienePermiso(b.dataset.area);
if(!ok){b.classList.add("inactivo");b.disabled=true}
if(ok&&b.dataset.area==="A8")b.onclick=()=>location.href="A8.html";
});

document.querySelectorAll(".tab").forEach(t=>{
t.onclick=()=>{
document.querySelectorAll(".tab").forEach(x=>x.classList.remove("activa"));
document.querySelectorAll(".subpanel").forEach(x=>x.classList.remove("activo"));
t.classList.add("activa");
document.getElementById(t.dataset.tab).classList.add("activo");
};
});

async function iniciar(){
try{
await cargarPerfilesCertificables();
rellenarSelector();
if(PERFILES_CERTIFICABLES.length){
perfil=PERFILES_CERTIFICABLES[0];
document.getElementById("selectorPerfil").value=perfil.codigo;
pintarPerfil();
}
}catch(e){alert("No se ha podido cargar el Maestro de Perfiles:\n\n"+e.message)}
}

function rellenarSelector(){
const s=document.getElementById("selectorPerfil");s.innerHTML="";
PERFILES_CERTIFICABLES.forEach(p=>{
const o=document.createElement("option");o.value=p.codigo;o.textContent=p.codigo+" · "+p.nombre;s.appendChild(o);
});
}

function seleccionarPerfil(){
perfil=buscarPerfilCertificable(document.getElementById("selectorPerfil").value);
pintarPerfil();
}

function pintarPerfil(){
if(!perfil)return;

pCodigo.value=perfil.codigo||"";
pNombre.value=perfil.nombre||"";
pVersion.value=perfil.version||"01";
pEstado.value=perfil.estado||"BORRADOR";
pAlcance.value=perfil.alcance||"";

estadoPerfil.innerHTML=perfil.estado==="APROBADO"
?'<span class="estado-aprobado">APROBADO</span>'
:'<span class="estado-borrador">'+(perfil.estado||"BORRADOR")+'</span>';

certInicial.value=(perfil.certificacion_inicial?.criterios||[]).join("\n");
vigAplica.value=String(!!perfil.vigilancia?.aplica);
vigCriterios.value=(perfil.vigilancia?.criterios||[]).join("\n");
recAplica.value=String(!!perfil.recertificacion?.aplica);
recMeses.value=perfil.recertificacion?.periodicidad_meses||0;
recCriterios.value=(perfil.recertificacion?.criterios||[]).join("\n");
susCriterios.value=(perfil.suspension_retirada?.criterios||[]).join("\n");
codAplica.value=String(!!perfil.codigo_conducta?.aplica);
codContenido.value=perfil.codigo_conducta?.contenido||"";

pintarListas();
}

function pintarListas(){
pintarLista("listaFunciones",perfil.funciones_tareas,x=>`<h3>${x.titulo}</h3><div>${x.descripcion||""}</div>`);
pintarLista("listaCompetencias",perfil.competencias,x=>`<h3>${x.nombre}</h3><div>${x.descripcion||""}</div>`);
pintarLista("listaEducacion",perfil.requisitos.educacion,x=>`<h3>${x.titulo}</h3><div>${x.descripcion||""}</div><div class="meta"><strong>Comprobación:</strong> ${x.metodo_comprobacion}</div>`);
pintarLista("listaFormacion",perfil.requisitos.formacion,x=>`<h3>${x.denominacion||x.titulo}</h3><div>${x.caracteristicas||""}</div><div class="meta">${x.duracion_horas||0} horas · <strong>Comprobación:</strong> ${x.metodo_comprobacion}</div>`);
pintarLista("listaExperiencia",perfil.requisitos.experiencia,x=>`<h3>${x.titulo}</h3><div>${x.descripcion||""}</div><div class="meta">${x.tipo||""} · ${x.duracion_meses||0} meses · ${x.horas||0} horas · <strong>Comprobación:</strong> ${x.metodo_comprobacion}</div>`);
pintarLista("listaExamenes",perfil.requisitos.examenes,x=>`<h3>${x.nombre}</h3><div>${x.descripcion||""}</div><div class="meta">${x.tipo_prueba} · Máx. ${x.metrica?.maximo||0} · APTO ≥ ${x.metrica?.minimo_apto||0}<br><strong>Comprobación:</strong> ${x.metodo_comprobacion}</div>`);
pintarLista("listaOtros",perfil.requisitos.otros,x=>`<h3>${x.titulo}</h3><div>${x.descripcion||""}</div><div class="meta"><strong>Comprobación:</strong> ${x.metodo_comprobacion}</div>`);

const lr=document.getElementById("listaRiesgos");
lr.innerHTML="";
if(!(perfil.riesgos||[]).length)lr.innerHTML='<div class="lista-vacia">No hay riesgos registrados.</div>';
else perfil.riesgos.forEach(r=>{
const d=document.createElement("div");
d.className="bloque "+(r.aceptable?"riesgo-ok":"riesgo-no");
d.innerHTML=`<h3>${r.riesgo}</h3><div>${r.consecuencia||""}</div><div class="meta"><span class="nivel">Nivel: ${r.nivel}</span> · ${r.aceptable?"ACEPTABLE":"NO ACEPTABLE"}<br><strong>Control:</strong> ${r.controles||"—"}<br><strong>Acción:</strong> ${r.accion||"—"}</div>`;
lr.appendChild(d);
});
}

function pintarLista(id,lista,fn){
const caja=document.getElementById(id);caja.innerHTML="";
if(!(lista||[]).length){caja.innerHTML='<div class="lista-vacia">No hay registros.</div>';return}
lista.forEach(x=>{const d=document.createElement("div");d.className="bloque";d.innerHTML=fn(x);caja.appendChild(d)});
}

async function guardarDatosBasicos(){
perfil.nombre=pNombre.value.trim();
perfil.version=pVersion.value.trim();
perfil.estado=pEstado.value;
perfil.alcance=pAlcance.value.trim();
await guardarPerfilesCertificables();mensaje("Identificación guardada.");
rellenarSelector();selectorPerfil.value=perfil.codigo;
}

async function nuevoPerfil(){
const nombre=prompt("Denominación del nuevo perfil certificable:");
if(!nombre)return;
perfil=await altaPerfilCertificable({nombre});
rellenarSelector();selectorPerfil.value=perfil.codigo;pintarPerfil();mensaje("Perfil creado.");
}

async function recargar(){await cargarPerfilesCertificables();rellenarSelector();seleccionarPerfil();mensaje("Datos recargados desde Dropbox.");}

async function guardarFuncion(){
await añadirFuncionTarea(perfil.codigo,{titulo:ftTitulo.value,descripcion:ftDescripcion.value});
ftTitulo.value="";ftDescripcion.value="";pintarListas();mensaje("Función añadida.");
}

async function guardarCompetencia(){
await añadirCompetencia(perfil.codigo,{nombre:comNombre.value,descripcion:comDescripcion.value});
comNombre.value="";comDescripcion.value="";pintarListas();mensaje("Competencia añadida.");
}

async function guardarRequisito(tipo){
const pref=tipo==="educacion"?"edu":"otr";
await añadirRequisito(perfil.codigo,tipo,{
titulo:document.getElementById(pref+"Titulo").value,
descripcion:document.getElementById(pref+"Descripcion").value,
metodo_comprobacion:document.getElementById(pref+"Metodo").value
});
document.getElementById(pref+"Titulo").value="";
document.getElementById(pref+"Descripcion").value="";
document.getElementById(pref+"Metodo").value="";
pintarListas();mensaje("Requisito añadido.");
}

async function guardarFormacion(){
const archivo=forArchivo.files[0];
await añadirFormacion(perfil.codigo,{
titulo:forTitulo.value,denominacion:forTitulo.value,duracion_horas:forHoras.value,
caracteristicas:forCaracteristicas.value,temario_texto:forTemario.value,
temario_archivo:archivo?{nombre:archivo.name,tipo:archivo.type}:null,
metodo_comprobacion:forMetodo.value
});
forTitulo.value="";forHoras.value="";forCaracteristicas.value="";forTemario.value="";forArchivo.value="";forMetodo.value="";
pintarListas();mensaje("Formación añadida.");
}

async function guardarExperiencia(){
await añadirExperiencia(perfil.codigo,{
titulo:expTitulo.value,descripcion:expDescripcion.value,tipo:expTipo.value,
duracion_meses:expMeses.value,horas:expHoras.value,tutelada:expTipo.value.includes("TUTELADA"),
requisitos_tutor:expTutor.value,metodo_comprobacion:expMetodo.value
});
expTitulo.value="";expDescripcion.value="";expMeses.value="";expHoras.value="";expTutor.value="";expMetodo.value="";
pintarListas();mensaje("Experiencia añadida.");
}

async function guardarExamen(){
await añadirExamen(perfil.codigo,{
nombre:exaNombre.value,descripcion:exaDescripcion.value,tipo_prueba:exaTipo.value,
metodo_comprobacion:exaMetodo.value,
metrica:{tipo:"PUNTUACIÓN",maximo:Number(exaMax.value),minimo_apto:Number(exaMin.value)},
rubrica:exaRubrica.value.trim()?[exaRubrica.value.trim()]:[]
});
exaNombre.value="";exaDescripcion.value="";exaMin.value="";exaRubrica.value="";exaMetodo.value="";
pintarListas();mensaje("Prueba añadida.");
}

async function guardarRiesgo(){
await añadirRiesgoPerfil(perfil.codigo,{
riesgo:rieRiesgo.value,causa:rieCausa.value,consecuencia:rieConsecuencia.value,
probabilidad:rieProb.value,impacto:rieImpacto.value,controles:rieControles.value,
accion:rieAccion.value,responsable:rieResponsable.value,riesgo_residual:rieResidual.value
});
["rieRiesgo","rieCausa","rieConsecuencia","rieControles","rieAccion","rieResponsable","rieResidual"].forEach(id=>document.getElementById(id).value="");
rieProb.value=1;rieImpacto.value=1;pintarListas();mensaje("Riesgo añadido.");
}

async function guardarCertificacion(){
perfil.certificacion_inicial.criterios=lineas(certInicial.value);
perfil.vigilancia={aplica:vigAplica.value==="true",criterios:lineas(vigCriterios.value)};
perfil.recertificacion={...perfil.recertificacion,aplica:recAplica.value==="true",periodicidad_meses:Number(recMeses.value||0),criterios:lineas(recCriterios.value)};
perfil.suspension_retirada={criterios:lineas(susCriterios.value)};
perfil.codigo_conducta={aplica:codAplica.value==="true",contenido:codContenido.value};
await guardarPerfilesCertificables();mensaje("Criterios de certificación guardados.");
}

function comprobarPerfil(){
const r=validarPerfilCertificable(perfil);
resultadoValidacion.innerHTML=r.valido
?'<div class="bloque riesgo-ok"><h3>PERFIL VALIDABLE</h3>No se han detectado bloqueos.</div>'
:'<div class="bloque riesgo-no"><h3>PERFIL INCOMPLETO</h3>'+r.errores.map(x=>"• "+x).join("<br>")+"</div>";
}

async function aprobarPerfil(){
try{
await aprobarPerfilCertificable(perfil.codigo,valResponsable.value,valObservaciones.value);
pintarPerfil();comprobarPerfil();mensaje("Perfil aprobado.");
}catch(e){alert(e.message)}
}

function lineas(t){return String(t||"").split("\n").map(x=>x.trim()).filter(Boolean)}
function mensaje(t){const m=document.getElementById("mensaje");m.textContent=t;m.classList.add("visible");setTimeout(()=>m.classList.remove("visible"),2200)}

iniciar();
</script>
