<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rita© | A1 Área Técnica</title>

<style>
@font-face{font-family:Tecnico;src:url("tecnico_regular.ttf") format("truetype");font-weight:400}
@font-face{font-family:Tecnico;src:url("tecnico_bold.ttf") format("truetype");font-weight:700}

*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%}
body{min-height:100vh;background:#edf5fb;color:#17344e;font-family:Tecnico,Arial,sans-serif}
.app{display:flex;min-height:100vh}

/* LATERAL */
.lateral{
width:330px;
min-width:330px;
min-height:100vh;
background:#003B5D;
color:#fff;
padding:38px 34px 30px;
display:flex;
flex-direction:column
}

.rita{
position:relative;
width:max-content;
font-size:82px;
line-height:.95;
letter-spacing:-4px
}

.copyright{
position:absolute;
top:-5px;
right:-22px;
font:20px Arial
}

.linea-rita{
width:92px;
height:5px;
background:#4dd4d0;
margin:35px 0 40px
}

.nombre-sistema{
width:250px;
font-size:25px;
line-height:1.28;
letter-spacing:1.5px;
text-transform:uppercase
}

.menu{
margin-top:28px;
padding-top:16px;
border-top:1px solid rgba(255,255,255,.22)
}

.menu-btn{
width:100%;
min-height:52px;
margin-bottom:8px;
padding:8px 11px;
border:1px solid rgba(255,255,255,.28);
border-radius:5px;
background:rgba(255,255,255,.08);
color:#fff;
display:flex;
align-items:center;
gap:10px;
text-align:left;
font-family:Tecnico;
cursor:pointer
}

.menu-btn.inactivo{
opacity:.28;
filter:grayscale(1);
cursor:not-allowed
}

.menu-btn.actual{
background:#fff;
color:#003B5D;
border-color:#fff
}

.menu-codigo{
width:35px;
font-size:18px;
font-weight:700;
color:#59d8d5
}

.menu-btn.actual .menu-codigo{
color:#003B5D
}

.menu-texto{
font-size:15px;
line-height:1.1;
text-transform:uppercase
}

.pie-lateral{
margin-top:auto;
padding:30px 0 95px;
display:flex;
justify-content:center
}

.pie-lateral img{
display:block;
width:382px;
max-width:100%;
height:auto
}

/* PRINCIPAL */
.principal{
flex:1;
min-width:0;
display:flex;
flex-direction:column
}

.cabecera{
height:185px;
min-height:185px;
background:#fff;
display:flex;
align-items:center;
padding:0 75px
}

.cabecera img{
display:block;
width:844px;
max-width:72vw;
height:auto
}

.zona{
flex:1;
padding:34px 42px 55px;
background:#edf5fb
}

/* CABECERA A1 */
.area-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:25px;
margin-bottom:22px
}

.area-identidad{
display:flex;
align-items:center;
gap:20px
}

.area-icono{
width:105px;
height:105px;
object-fit:contain;
border-radius:14px
}

.area-titulo h1{
margin:0;
font-size:46px;
font-weight:400
}

.area-titulo p{
margin:6px 0 0;
color:#718ca4;
font-size:20px
}

.usuario{
text-align:right;
color:#718ca4;
font-size:17px
}

.usuario strong{
display:block;
color:#17344e;
font-size:22px
}

.volver{
margin-top:10px;
padding:10px 17px;
border:1px solid #b9cbd8;
border-radius:5px;
background:#fff;
color:#315675;
font:16px Tecnico;
cursor:pointer
}

/* FUNCIONES */
.funciones{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:22px
}

.funcion{
padding:14px 22px;
border:1px solid #bdd0dc;
border-radius:6px;
background:#fff;
color:#45647d;
font:17px Tecnico;
cursor:pointer
}

.funcion.activa{
background:#0873ae;
color:#fff;
border-color:#0873ae
}

/* PANEL */
.panel{
background:#fff;
border:1px solid #cbd9e3;
border-radius:8px;
padding:26px 28px 32px
}

.panel h2{
margin:0 0 5px;
font-size:31px;
font-weight:400
}

.intro{
margin:0 0 22px;
color:#718ca4;
font-size:18px
}

/* BARRA */
.barra{
display:flex;
gap:12px;
align-items:center;
margin-bottom:22px;
flex-wrap:wrap
}

.barra select{
height:48px;
min-width:340px;
border:1px solid #bfd0dc;
border-radius:5px;
background:#fff;
color:#17344e;
padding:0 13px;
font:17px Tecnico
}

.btn{
border:0;
border-radius:5px;
padding:12px 19px;
font:16px Tecnico;
cursor:pointer
}

.btn-azul{
background:#0873ae;
color:#fff
}

.btn-claro{
background:#e9f1f6;
color:#315675
}

.btn-verde{
background:#378b62;
color:#fff
}

/* PESTAÑAS */
.tabs{
display:flex;
gap:5px;
flex-wrap:wrap;
border-bottom:1px solid #bacdda;
margin-top:10px
}

.tab{
padding:12px 16px;
border:1px solid #c7d6e0;
border-bottom:0;
border-radius:6px 6px 0 0;
background:#f7fafc;
color:#4e6b84;
font:15px Tecnico;
cursor:pointer
}

.tab.activa{
background:#0873ae;
color:#fff;
border-color:#0873ae
}

.subpanel{
display:none;
border:1px solid #cddae4;
border-top:0;
padding:24px;
background:#fff
}

.subpanel.activo{
display:block
}

/* CAMPOS */
.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:17px 24px
}

.campo{
display:flex;
flex-direction:column;
gap:6px
}

.campo.ancho{
grid-column:1/-1
}

.campo label{
font-size:14px;
font-weight:700;
color:#58738c;
text-transform:uppercase;
letter-spacing:.5px
}

.campo input,
.campo select,
.campo textarea{
width:100%;
border:1px solid #bfd0dc;
border-radius:5px;
background:#fff;
color:#17344e;
font:17px Tecnico;
padding:11px 13px;
outline:none
}

.campo input,
.campo select{
height:48px
}

.campo textarea{
min-height:105px;
resize:vertical
}

.campo input:focus,
.campo select:focus,
.campo textarea:focus{
border-color:#1684b5
}

/* LISTAS */
.bloque{
border:1px solid #d5e0e7;
border-radius:7px;
padding:18px;
margin-bottom:14px;
background:#fbfdfe
}

.bloque h3{
margin:0 0 10px;
font-size:20px;
font-weight:400;
color:#274b67
}

.bloque .meta{
font-size:14px;
color:#71879a;
margin-top:6px
}

.lista-vacia{
padding:20px;
color:#8092a1;
text-align:center;
border:1px dashed #cbd8e1;
border-radius:6px
}

.acciones{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:18px
}

/* RIESGOS */
.riesgo-ok{
border-left:6px solid #399168
}

.riesgo-no{
border-left:6px solid #c54f4f
}

.nivel{
font-weight:700
}

.estado-aprobado{
display:inline-block;
padding:6px 12px;
border-radius:15px;
background:#d8f0e3;
color:#28724c;
font-size:14px
}

.estado-borrador{
display:inline-block;
padding:6px 12px;
border-radius:15px;
background:#f1e9cf;
color:#8a6a15;
font-size:14px
}

.mensaje{
display:none;
margin-top:14px;
padding:11px 14px;
border-radius:5px;
background:#e5f3e9;
color:#2b6944;
font-size:15px
}

.mensaje.visible{
display:block
}

@media(max-width:1200px){
.lateral{
width:285px;
min-width:285px
}

.cabecera{
height:160px;
min-height:160px;
padding:0 55px
}

.cabecera img{
width:730px
}

.grid{
grid-template-columns:1fr
}
}
</style>
</head>

<body>

<div class="app">

<aside class="lateral">

<div class="rita">
Rita
<span class="copyright">©</span>
</div>

<div class="linea-rita"></div>

<div class="nombre-sistema">
Sistema de Gestión<br>
del Esquema de<br>
Certificación<br>
de Personas
</div>

<nav class="menu">

<button class="menu-btn actual" data-area="A1">
<span class="menu-codigo">A1</span>
<span class="menu-texto">Área Técnica</span>
</button>

<button class="menu-btn" data-area="A2">
<span class="menu-codigo">A2</span>
<span class="menu-texto">Área de Gestión</span>
</button>

<button class="menu-btn" data-area="A3">
<span class="menu-codigo">A3</span>
<span class="menu-texto">Área de Evaluación</span>
</button>

<button class="menu-btn" data-area="A4">
<span class="menu-codigo">A4</span>
<span class="menu-texto">Área de Formación</span>
</button>

<button class="menu-btn" data-area="A5">
<span class="menu-codigo">A5</span>
<span class="menu-texto">Área de Decisión</span>
</button>

<button class="menu-btn" data-area="A6">
<span class="menu-codigo">A6</span>
<span class="menu-texto">Área de Conflictos</span>
</button>

<button class="menu-btn" data-area="A7">
<span class="menu-codigo">A7</span>
<span class="menu-texto">Área de Mejora</span>
</button>

<button class="menu-btn" data-area="A8">
<span class="menu-codigo">A8</span>
<span class="menu-texto">Configuración</span>
</button>

</nav>

<div class="pie-lateral">
<img src="pie.png" alt="">
</div>

</aside>

<main class="principal">

<header class="cabecera">
<img src="cabecera1.png" alt="UFV - Instituto de Acompañamiento">
</header>

<section class="zona">

<div class="area-head">

<div class="area-identidad">

<img class="area-icono" src="ICOA1.png" alt="A1">

<div class="area-titulo">
<h1>A1 · Área Técnica</h1>
<p>
Definición y mantenimiento de perfiles certificables
y esquemas de certificación
</p>
</div>

</div>

<div class="usuario">
<strong id="usuarioCabecera"></strong>
<span id="rolCabecera"></span><br>
<button class="volver" onclick="location.href='index.html'">
Volver al inicio
</button>
</div>

</div>

<div class="funciones">
<button class="funcion activa">
Perfil certificable
</button>

<button class="funcion"
onclick="alert('Esquema de certificación: pendiente de construir.')">
Esquema de certificación
</button>
</div>

<div class="panel">

<h2>
Alta / modificación de perfil certificable
</h2>

<p class="intro">
Definición técnica del perfil cuya competencia será objeto de certificación.
</p>

<div class="barra">

<select id="selectorPerfil"
onchange="seleccionarPerfil()">
</select>

<button class="btn btn-azul"
onclick="nuevoPerfil()">
Nuevo perfil
</button>

<button class="btn btn-claro"
onclick="recargarPerfiles()">
Recargar Dropbox
</button>

<span id="estadoPerfil"></span>

</div>

<div class="tabs">

<button class="tab activa" data-tab="identificacion">
Identificación
</button>

<button class="tab" data-tab="funciones">
Funciones / tareas
</button>

<button class="tab" data-tab="competencias">
Competencias
</button>

<button class="tab" data-tab="educacion">
Educación
</button>

<button class="tab" data-tab="formacion">
Formación
</button>

<button class="tab" data-tab="experiencia">
Experiencia
</button>

<button class="tab" data-tab="examenes">
Examen / prueba
</button>

<button class="tab" data-tab="otros">
Otros
</button>

<button class="tab" data-tab="riesgos">
Riesgos
</button>

<button class="tab" data-tab="certificacion">
Certificación
</button>

<button class="tab" data-tab="validacion">
Validación
</button>

</div>

<!-- IDENTIFICACIÓN -->

<div class="subpanel activo" id="identificacion">

<div class="grid">

<div class="campo">
<label>Código</label>
<input id="pCodigo" readonly>
</div>

<div class="campo">
<label>Denominación</label>
<input id="pNombre">
</div>

<div class="campo">
<label>Versión</label>
<input id="pVersion">
</div>

<div class="campo">
<label>Estado</label>
<select id="pEstado">
<option>BORRADOR</option>
<option>EN REVISIÓN</option>
<option>APROBADO</option>
<option>OBSOLETO</option>
</select>
</div>

<div class="campo ancho">
<label>Alcance del perfil certificable</label>
<textarea id="pAlcance"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarDatosBasicos()">
Guardar identificación
</button>
</div>

</div>

<!-- FUNCIONES -->

<div class="subpanel" id="funciones">

<div id="listaFunciones"></div>

<div class="grid">

<div class="campo">
<label>Función / tarea</label>
<input id="ftTitulo">
</div>

<div class="campo ancho">
<label>Descripción</label>
<textarea id="ftDescripcion"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarFuncion()">
Añadir función / tarea
</button>
</div>

</div>

<!-- COMPETENCIAS -->

<div class="subpanel" id="competencias">

<div id="listaCompetencias"></div>

<div class="grid">

<div class="campo">
<label>Competencia</label>
<input id="comNombre">
</div>

<div class="campo ancho">
<label>Descripción / criterio de competencia</label>
<textarea id="comDescripcion"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarCompetencia()">
Añadir competencia
</button>
</div>

</div>

<!-- EDUCACIÓN -->

<div class="subpanel" id="educacion">

<div id="listaEducacion"></div>

<div class="grid">

<div class="campo">
<label>Requisito de educación</label>
<input id="eduTitulo">
</div>

<div class="campo ancho">
<label>Descripción</label>
<textarea id="eduDescripcion"></textarea>
</div>

<div class="campo ancho">
<label>Método de comprobación</label>
<textarea id="eduMetodo"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarRequisito('educacion')">
Añadir requisito
</button>
</div>

</div>

<!-- FORMACIÓN -->

<div class="subpanel" id="formacion">

<div id="listaFormacion"></div>

<div class="grid">

<div class="campo">
<label>Curso / formación</label>
<input id="forTitulo">
</div>

<div class="campo">
<label>Duración (horas)</label>
<input id="forHoras" type="number">
</div>

<div class="campo ancho">
<label>Características del curso</label>
<textarea id="forCaracteristicas"></textarea>
</div>

<div class="campo ancho">
<label>Temario / contenidos</label>
<textarea id="forTemario"></textarea>
</div>

<div class="campo ancho">
<label>Temario en PDF o TXT</label>
<input id="forArchivo" type="file" accept=".pdf,.txt">
</div>

<div class="campo ancho">
<label>Método de comprobación</label>
<textarea id="forMetodo"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarFormacion()">
Añadir formación
</button>
</div>

</div>

<!-- EXPERIENCIA -->

<div class="subpanel" id="experiencia">

<div id="listaExperiencia"></div>

<div class="grid">

<div class="campo">
<label>Experiencia requerida</label>
<input id="expTitulo">
</div>

<div class="campo">
<label>Tipo</label>
<select id="expTipo">
<option>LABORAL</option>
<option>TUTELADA</option>
<option>LABORAL Y TUTELADA</option>
</select>
</div>

<div class="campo">
<label>Duración mínima (meses)</label>
<input id="expMeses" type="number">
</div>

<div class="campo">
<label>Horas mínimas</label>
<input id="expHoras" type="number">
</div>

<div class="campo ancho">
<label>Descripción</label>
<textarea id="expDescripcion"></textarea>
</div>

<div class="campo ancho">
<label>Requisitos del tutor</label>
<textarea id="expTutor"></textarea>
</div>

<div class="campo ancho">
<label>Método de comprobación</label>
<textarea id="expMetodo"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarExperiencia()">
Añadir experiencia
</button>
</div>

</div>

<!-- EXAMEN -->

<div class="subpanel" id="examenes">

<div id="listaExamenes"></div>

<div class="grid">

<div class="campo">
<label>Denominación de la prueba</label>
<input id="exaNombre">
</div>

<div class="campo">
<label>Tipo de prueba</label>
<select id="exaTipo">
<option>CONOCIMIENTOS</option>
<option>PRÁCTICA</option>
<option>ORAL</option>
<option>MIXTA</option>
</select>
</div>

<div class="campo ancho">
<label>Descripción</label>
<textarea id="exaDescripcion"></textarea>
</div>

<div class="campo">
<label>Puntuación máxima</label>
<input id="exaMax" type="number" value="100">
</div>

<div class="campo">
<label>Mínimo para APTO</label>
<input id="exaMin" type="number">
</div>

<div class="campo ancho">
<label>Métrica / rúbrica</label>
<textarea id="exaRubrica"></textarea>
</div>

<div class="campo ancho">
<label>Método de comprobación</label>
<textarea id="exaMetodo"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarExamen()">
Añadir examen / prueba
</button>
</div>

</div>

<!-- OTROS -->

<div class="subpanel" id="otros">

<div id="listaOtros"></div>

<div class="grid">

<div class="campo">
<label>Otro requisito</label>
<input id="otrTitulo">
</div>

<div class="campo ancho">
<label>Descripción</label>
<textarea id="otrDescripcion"></textarea>
</div>

<div class="campo ancho">
<label>Método de comprobación</label>
<textarea id="otrMetodo"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarRequisito('otros')">
Añadir requisito
</button>
</div>

</div>

<!-- RIESGOS -->

<div class="subpanel" id="riesgos">

<div id="listaRiesgos"></div>

<div class="grid">

<div class="campo">
<label>Riesgo</label>
<input id="rieRiesgo">
</div>

<div class="campo">
<label>Causa</label>
<input id="rieCausa">
</div>

<div class="campo ancho">
<label>Consecuencia</label>
<textarea id="rieConsecuencia"></textarea>
</div>

<div class="campo">
<label>Probabilidad (1-5)</label>
<input id="rieProb" type="number" min="1" max="5" value="1">
</div>

<div class="campo">
<label>Impacto (1-5)</label>
<input id="rieImpacto" type="number" min="1" max="5" value="1">
</div>

<div class="campo ancho">
<label>Controles existentes</label>
<textarea id="rieControles"></textarea>
</div>

<div class="campo ancho">
<label>Acción / tratamiento</label>
<textarea id="rieAccion"></textarea>
</div>

<div class="campo">
<label>Responsable</label>
<input id="rieResponsable">
</div>

<div class="campo">
<label>Riesgo residual</label>
<input id="rieResidual" type="number">
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarRiesgo()">
Añadir riesgo
</button>
</div>

</div>

<!-- CERTIFICACIÓN -->

<div class="subpanel" id="certificacion">

<div class="grid">

<div class="campo ancho">
<label>Criterios de certificación inicial</label>
<textarea id="certInicial"></textarea>
</div>

<div class="campo">
<label>Vigilancia</label>
<select id="vigAplica">
<option value="false">No aplica</option>
<option value="true">Aplica</option>
</select>
</div>

<div class="campo">
<label>Recertificación</label>
<select id="recAplica">
<option value="false">No aplica</option>
<option value="true">Aplica</option>
</select>
</div>

<div class="campo">
<label>Periodicidad de recertificación (meses)</label>
<input id="recMeses" type="number">
</div>

<div class="campo ancho">
<label>Criterios de vigilancia</label>
<textarea id="vigCriterios"></textarea>
</div>

<div class="campo ancho">
<label>Criterios de recertificación</label>
<textarea id="recCriterios"></textarea>
</div>

<div class="campo ancho">
<label>Criterios de suspensión / retirada</label>
<textarea id="susCriterios"></textarea>
</div>

<div class="campo">
<label>Código de conducta</label>
<select id="codAplica">
<option value="false">No aplica</option>
<option value="true">Aplica</option>
</select>
</div>

<div class="campo ancho">
<label>Contenido / referencia</label>
<textarea id="codContenido"></textarea>
</div>

</div>

<div class="acciones">
<button class="btn btn-azul"
onclick="guardarCertificacion()">
Guardar criterios
</button>
</div>

</div>

<!-- VALIDACIÓN -->

<div class="subpanel" id="validacion">

<div id="resultadoValidacion"></div>

<div class="grid">

<div class="campo">
<label>Responsable de validación</label>
<input id="valResponsable">
</div>

<div class="campo ancho">
<label>Observaciones</label>
<textarea id="valObservaciones"></textarea>
</div>

</div>

<div class="acciones">

<button class="btn btn-claro"
onclick="comprobarPerfil()">
Comprobar perfil
</button>

<button class="btn btn-verde"
onclick="aprobarPerfil()">
Aprobar perfil
</button>

</div>

</div>

<div class="mensaje" id="mensaje"></div>

</div>

</section>
</main>

</div>

<script src="dropbox_config.js"></script>
<script src="usuarios.js"></script>
<script src="maestro_perfiles_certificables.js"></script>

<script>
let perfil=null;

const sesion=usuarioActivo();

if(!sesion||!tienePermiso("A1")){
alert(
"No dispone de autorización para acceder al Área Técnica."
);
location.href="index.html";
}

document.getElementById(
"usuarioCabecera"
).textContent=
sesion?.nombre||"";

document.getElementById(
"rolCabecera"
).textContent=
sesion?.rol||"";

/* MENÚ LATERAL */

document.querySelectorAll(
".menu-btn"
).forEach(b=>{

const ok=
tienePermiso(
b.dataset.area
);

if(!ok){
b.classList.add("inactivo");
b.disabled=true;
return;
}

if(b.dataset.area==="A1"){
b.onclick=()=>location.href="A1.html";
return;
}

if(b.dataset.area==="A8"){
b.onclick=()=>location.href="A8.html";
return;
}

b.onclick=()=>{
alert(
b.dataset.area+
" · Área en preparación"
);
};

});

/* PESTAÑAS */

document.querySelectorAll(
".tab"
).forEach(t=>{

t.onclick=()=>{

document.querySelectorAll(
".tab"
).forEach(x=>
x.classList.remove("activa")
);

document.querySelectorAll(
".subpanel"
).forEach(x=>
x.classList.remove("activo")
);

t.classList.add("activa");

document.getElementById(
t.dataset.tab
).classList.add("activo");

};

});

/* INICIALIZACIÓN */

async function iniciarA1(){

try{

await cargarPerfilesCertificables();

rellenarSelector();

if(PERFILES_CERTIFICABLES.length){

perfil=
PERFILES_CERTIFICABLES[0];

document.getElementById(
"selectorPerfil"
).value=
perfil.codigo;

pintarPerfil();

}

}catch(e){

console.error(e);

alert(
"No se ha podido cargar el Maestro de Perfiles:\n\n"+
e.message
);

}

}

/* SELECTOR */

function rellenarSelector(){

const s=
document.getElementById(
"selectorPerfil"
);

s.innerHTML="";

PERFILES_CERTIFICABLES
.forEach(p=>{

const o=
document.createElement(
"option"
);

o.value=
p.codigo;

o.textContent=
p.codigo+
" · "+
p.nombre;

s.appendChild(o);

});

}

function seleccionarPerfil(){

perfil=
buscarPerfilCertificable(
document.getElementById(
"selectorPerfil"
).value
);

pintarPerfil();

}

/* PINTAR PERFIL */

function pintarPerfil(){

if(!perfil)return;

document.getElementById(
"pCodigo"
).value=
perfil.codigo||"";

document.getElementById(
"pNombre"
).value=
perfil.nombre||"";

document.getElementById(
"pVersion"
).value=
perfil.version||"01";

document.getElementById(
"pEstado"
).value=
perfil.estado||"BORRADOR";

document.getElementById(
"pAlcance"
).value=
perfil.alcance||"";

document.getElementById(
"estadoPerfil"
).innerHTML=
perfil.estado==="APROBADO"
?'<span class="estado-aprobado">APROBADO</span>'
:'<span class="estado-borrador">'+
(perfil.estado||"BORRADOR")+
'</span>';

document.getElementById(
"certInicial"
).value=
(
perfil.certificacion_inicial
?.criterios||
[]
).join("\n");

document.getElementById(
"vigAplica"
).value=
String(
!!perfil.vigilancia?.aplica
);

document.getElementById(
"vigCriterios"
).value=
(
perfil.vigilancia
?.criterios||
[]
).join("\n");

document.getElementById(
"recAplica"
).value=
String(
!!perfil.recertificacion?.aplica
);

document.getElementById(
"recMeses"
).value=
perfil.recertificacion
?.periodicidad_meses||
0;

document.getElementById(
"recCriterios"
).value=
(
perfil.recertificacion
?.criterios||
[]
).join("\n");

document.getElementById(
"susCriterios"
).value=
(
perfil.suspension_retirada
?.criterios||
[]
).join("\n");

document.getElementById(
"codAplica"
).value=
String(
!!perfil.codigo_conducta?.aplica
);

document.getElementById(
"codContenido"
).value=
perfil.codigo_conducta
?.contenido||
"";

pintarListas();

}

/* PINTAR LISTAS */

function pintarLista(
id,
lista,
fn
){

const caja=
document.getElementById(id);

caja.innerHTML="";

if(!(lista||[]).length){

caja.innerHTML=
'<div class="lista-vacia">No hay registros.</div>';

return;

}

lista.forEach(x=>{

const d=
document.createElement(
"div"
);

d.className="bloque";

d.innerHTML=
fn(x);

caja.appendChild(d);

});

}

function pintarListas(){

if(!perfil)return;

pintarLista(
"listaFunciones",
perfil.funciones_tareas,
x=>
`<h3>${x.titulo}</h3>
<div>${x.descripcion||""}</div>`
);

pintarLista(
"listaCompetencias",
perfil.competencias,
x=>
`<h3>${x.nombre}</h3>
<div>${x.descripcion||""}</div>`
);

pintarLista(
"listaEducacion",
perfil.requisitos.educacion,
x=>
`<h3>${x.titulo}</h3>
<div>${x.descripcion||""}</div>
<div class="meta">
<strong>Comprobación:</strong>
${x.metodo_comprobacion}
</div>`
);

pintarLista(
"listaFormacion",
perfil.requisitos.formacion,
x=>
`<h3>${x.denominacion||x.titulo}</h3>
<div>${x.caracteristicas||""}</div>
<div class="meta">
${x.duracion_horas||0} horas ·
<strong>Comprobación:</strong>
${x.metodo_comprobacion}
</div>`
);

pintarLista(
"listaExperiencia",
perfil.requisitos.experiencia,
x=>
`<h3>${x.titulo}</h3>
<div>${x.descripcion||""}</div>
<div class="meta">
${x.tipo||""} ·
${x.duracion_meses||0} meses ·
${x.horas||0} horas ·
<strong>Comprobación:</strong>
${x.metodo_comprobacion}
</div>`
);

pintarLista(
"listaExamenes",
perfil.requisitos.examenes,
x=>
`<h3>${x.nombre}</h3>
<div>${x.descripcion||""}</div>
<div class="meta">
${x.tipo_prueba||""} ·
Máx. ${x.metrica?.maximo||0} ·
APTO ≥ ${x.metrica?.minimo_apto||0}
<br>
<strong>Comprobación:</strong>
${x.metodo_comprobacion}
</div>`
);

pintarLista(
"listaOtros",
perfil.requisitos.otros,
x=>
`<h3>${x.titulo}</h3>
<div>${x.descripcion||""}</div>
<div class="meta">
<strong>Comprobación:</strong>
${x.metodo_comprobacion}
</div>`
);

const lr=
document.getElementById(
"listaRiesgos"
);

lr.innerHTML="";

if(!(perfil.riesgos||[]).length){

lr.innerHTML=
'<div class="lista-vacia">No hay riesgos registrados.</div>';

}else{

perfil.riesgos.forEach(r=>{

const d=
document.createElement(
"div"
);

d.className=
"bloque "+
(
r.aceptable
?"riesgo-ok"
:"riesgo-no"
);

d.innerHTML=
`<h3>${r.riesgo}</h3>
<div>${r.consecuencia||""}</div>
<div class="meta">
<span class="nivel">
Nivel: ${r.nivel}
</span>
·
${r.aceptable
?"ACEPTABLE"
:"NO ACEPTABLE"}
<br>
<strong>Control:</strong>
${r.controles||"—"}
<br>
<strong>Acción:</strong>
${r.accion||"—"}
</div>`;

lr.appendChild(d);

});

}

}

/* IDENTIFICACIÓN */

async function guardarDatosBasicos(){

if(!perfil)return;

perfil.nombre=
document.getElementById(
"pNombre"
).value.trim();

perfil.version=
document.getElementById(
"pVersion"
).value.trim();

perfil.estado=
document.getElementById(
"pEstado"
).value;

perfil.alcance=
document.getElementById(
"pAlcance"
).value.trim();

await guardarPerfilesCertificables();

rellenarSelector();

document.getElementById(
"selectorPerfil"
).value=
perfil.codigo;

mensaje(
"Identificación guardada."
);

}

/* NUEVO PERFIL */

async function nuevoPerfil(){

const nombre=
prompt(
"Denominación del nuevo perfil certificable:"
);

if(!nombre)return;

try{

perfil=
await altaPerfilCertificable({
nombre
});

rellenarSelector();

document.getElementById(
"selectorPerfil"
).value=
perfil.codigo;

pintarPerfil();

mensaje(
"Perfil creado."
);

}catch(e){

alert(e.message);

}

}

/* RECARGAR */

async function recargarPerfiles(){

try{

const actual=
perfil?.codigo||"";

await cargarPerfilesCertificables();

rellenarSelector();

if(
actual &&
buscarPerfilCertificable(actual)
){

document.getElementById(
"selectorPerfil"
).value=
actual;

perfil=
buscarPerfilCertificable(actual);

}else{

perfil=
PERFILES_CERTIFICABLES[0]||
null;

if(perfil){

document.getElementById(
"selectorPerfil"
).value=
perfil.codigo;

}

}

pintarPerfil();

mensaje(
"Datos recargados desde Dropbox."
);

}catch(e){

alert(e.message);

}

}

/* FUNCIÓN */

async function guardarFuncion(){

try{

await añadirFuncionTarea(
perfil.codigo,
{
titulo:
document.getElementById(
"ftTitulo"
).value,

descripcion:
document.getElementById(
"ftDescripcion"
).value
}
);

document.getElementById(
"ftTitulo"
).value="";

document.getElementById(
"ftDescripcion"
).value="";

pintarListas();

mensaje(
"Función añadida."
);

}catch(e){

alert(e.message);

}

}

/* COMPETENCIA */

async function guardarCompetencia(){

try{

await añadirCompetencia(
perfil.codigo,
{
nombre:
document.getElementById(
"comNombre"
).value,

descripcion:
document.getElementById(
"comDescripcion"
).value
}
);

document.getElementById(
"comNombre"
).value="";

document.getElementById(
"comDescripcion"
).value="";

pintarListas();

mensaje(
"Competencia añadida."
);

}catch(e){

alert(e.message);

}

}

/* REQUISITOS */

async function guardarRequisito(tipo){

try{

const pref=
tipo==="educacion"
?"edu"
:"otr";

await añadirRequisito(
perfil.codigo,
tipo,
{
titulo:
document.getElementById(
pref+"Titulo"
).value,

descripcion:
document.getElementById(
pref+"Descripcion"
).value,

metodo_comprobacion:
document.getElementById(
pref+"Metodo"
).value
}
);

document.getElementById(
pref+"Titulo"
).value="";

document.getElementById(
pref+"Descripcion"
).value="";

document.getElementById(
pref+"Metodo"
).value="";

pintarListas();

mensaje(
"Requisito añadido."
);

}catch(e){

alert(e.message);

}

}

/* FORMACIÓN */

async function guardarFormacion(){

try{

const archivo=
document.getElementById(
"forArchivo"
).files[0];

await añadirFormacion(
perfil.codigo,
{
titulo:
document.getElementById(
"forTitulo"
).value,

denominacion:
document.getElementById(
"forTitulo"
).value,

duracion_horas:
document.getElementById(
"forHoras"
).value,

caracteristicas:
document.getElementById(
"forCaracteristicas"
).value,

temario_texto:
document.getElementById(
"forTemario"
).value,

temario_archivo:
archivo
?{
nombre:archivo.name,
tipo:archivo.type
}
:null,

metodo_comprobacion:
document.getElementById(
"forMetodo"
).value
}
);

document.getElementById(
"forTitulo"
).value="";

document.getElementById(
"forHoras"
).value="";

document.getElementById(
"forCaracteristicas"
).value="";

document.getElementById(
"forTemario"
).value="";

document.getElementById(
"forArchivo"
).value="";

document.getElementById(
"forMetodo"
).value="";

pintarListas();

mensaje(
"Formación añadida."
);

}catch(e){

alert(e.message);

}

}

/* EXPERIENCIA */

async function guardarExperiencia(){

try{

const tipo=
document.getElementById(
"expTipo"
).value;

await añadirExperiencia(
perfil.codigo,
{
titulo:
document.getElementById(
"expTitulo"
).value,

descripcion:
document.getElementById(
"expDescripcion"
).value,

tipo,

duracion_meses:
document.getElementById(
"expMeses"
).value,

horas:
document.getElementById(
"expHoras"
).value,

tutelada:
tipo.includes(
"TUTELADA"
),

requisitos_tutor:
document.getElementById(
"expTutor"
).value,

metodo_comprobacion:
document.getElementById(
"expMetodo"
).value
}
);

document.getElementById(
"expTitulo"
).value="";

document.getElementById(
"expDescripcion"
).value="";

document.getElementById(
"expMeses"
).value="";

document.getElementById(
"expHoras"
).value="";

document.getElementById(
"expTutor"
).value="";

document.getElementById(
"expMetodo"
).value="";

pintarListas();

mensaje(
"Experiencia añadida."
);

}catch(e){

alert(e.message);

}

}

/* EXAMEN */

async function guardarExamen(){

try{

const rubrica=
document.getElementById(
"exaRubrica"
).value.trim();

await añadirExamen(
perfil.codigo,
{
nombre:
document.getElementById(
"exaNombre"
).value,

descripcion:
document.getElementById(
"exaDescripcion"
).value,

tipo_prueba:
document.getElementById(
"exaTipo"
).value,

metodo_comprobacion:
document.getElementById(
"exaMetodo"
).value,

metrica:{
tipo:"PUNTUACIÓN",

maximo:Number(
document.getElementById(
"exaMax"
).value
),

minimo_apto:Number(
document.getElementById(
"exaMin"
).value
)
},

rubrica:
rubrica
?[rubrica]
:[]
}
);

document.getElementById(
"exaNombre"
).value="";

document.getElementById(
"exaDescripcion"
).value="";

document.getElementById(
"exaMin"
).value="";

document.getElementById(
"exaRubrica"
).value="";

document.getElementById(
"exaMetodo"
).value="";

pintarListas();

mensaje(
"Prueba añadida."
);

}catch(e){

alert(e.message);

}

}

/* RIESGOS */

async function guardarRiesgo(){

try{

await añadirRiesgoPerfil(
perfil.codigo,
{
riesgo:
document.getElementById(
"rieRiesgo"
).value,

causa:
document.getElementById(
"rieCausa"
).value,

consecuencia:
document.getElementById(
"rieConsecuencia"
).value,

probabilidad:
document.getElementById(
"rieProb"
).value,

impacto:
document.getElementById(
"rieImpacto"
).value,

controles:
document.getElementById(
"rieControles"
).value,

accion:
document.getElementById(
"rieAccion"
).value,

responsable:
document.getElementById(
"rieResponsable"
).value,

riesgo_residual:
document.getElementById(
"rieResidual"
).value
}
);

[
"rieRiesgo",
"rieCausa",
"rieConsecuencia",
"rieControles",
"rieAccion",
"rieResponsable",
"rieResidual"
].forEach(id=>{
document.getElementById(id).value="";
});

document.getElementById(
"rieProb"
).value=1;

document.getElementById(
"rieImpacto"
).value=1;

pintarListas();

mensaje(
"Riesgo añadido."
);

}catch(e){

alert(e.message);

}

}

/* CERTIFICACIÓN */

async function guardarCertificacion(){

perfil.certificacion_inicial={
criterios:
lineas(
document.getElementById(
"certInicial"
).value
),
metodos_evaluacion:
perfil.certificacion_inicial
?.metodos_evaluacion||
[]
};

perfil.vigilancia={
aplica:
document.getElementById(
"vigAplica"
).value==="true",

criterios:
lineas(
document.getElementById(
"vigCriterios"
).value
)
};

perfil.recertificacion={
...perfil.recertificacion,

aplica:
document.getElementById(
"recAplica"
).value==="true",

periodicidad_meses:
Number(
document.getElementById(
"recMeses"
).value||
0
),

criterios:
lineas(
document.getElementById(
"recCriterios"
).value
)
};

perfil.suspension_retirada={
criterios:
lineas(
document.getElementById(
"susCriterios"
).value
)
};

perfil.codigo_conducta={
aplica:
document.getElementById(
"codAplica"
).value==="true",

contenido:
document.getElementById(
"codContenido"
).value
};

await guardarPerfilesCertificables();

mensaje(
"Criterios de certificación guardados."
);

}

/* VALIDACIÓN */

function comprobarPerfil(){

const r=
validarPerfilCertificable(
perfil
);

document.getElementById(
"resultadoValidacion"
).innerHTML=
r.valido
?'<div class="bloque riesgo-ok"><h3>PERFIL VALIDABLE</h3>No se han detectado bloqueos.</div>'
:'<div class="bloque riesgo-no"><h3>PERFIL INCOMPLETO</h3>'+
r.errores.map(
x=>"• "+x
).join("<br>")+
"</div>";

}

async function aprobarPerfil(){

try{

await aprobarPerfilCertificable(
perfil.codigo,

document.getElementById(
"valResponsable"
).value,

document.getElementById(
"valObservaciones"
).value
);

pintarPerfil();

comprobarPerfil();

mensaje(
"Perfil aprobado."
);

}catch(e){

alert(e.message);

}

}

/* UTILIDADES */

function lineas(t){

return String(
t||""
)
.split("\n")
.map(
x=>x.trim()
)
.filter(Boolean);

}

function mensaje(texto){

const m=
document.getElementById(
"mensaje"
);

m.textContent=
texto;

m.classList.add(
"visible"
);

setTimeout(
()=>m.classList.remove(
"visible"
),
2200
);

}

/* ARRANQUE */

iniciarA1();
</script>

</body>
</html>
