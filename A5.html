function cod(){let n=1;while(D.decisiones.some(x=>x.codigo==="DEC-"+String(n).padStart(3,"0")))n++;return"DEC-"+String(n).padStart(3,"0")}function msg(t){$("msg").textContent=t;$("msg").className="mensaje on";setTimeout(()=>$("msg").className="mensaje",2500)}function eva(c){return D.evaluaciones.find(x=>x.expediente_codigo===c)||null}function dec(c){return D.decisiones.find(x=>x.expediente_codigo===c)||null}function pendientes(){return D.expedientes.filter(x=>U(x.estado)==="PENDIENTE DE DECISIÓN"||U(x.fase)==="DECISIÓN"||U(x.fase)==="DECISION")}

async function guardarDecision(){if(!independencia(EVA))return alert("No puede decidir porque ha intervenido como examinador.");let d=$("dDecision").value,pq=S($("dPorque").value),tr=S($("dTrans").value);if(!d)return alert("Seleccione una decisión.");if(!pq)return alert("El POR QUÉ de la decisión es obligatorio.");if(!tr)return alert("Debe redactar la información transparente para el solicitante.");if($("dRev").value!=="true")return alert("Debe confirmar la revisión completa del expediente.");if($("dConf").value!=="true")return alert("Debe confirmar la ausencia de conflicto.");let x=DEC||{codigo:cod(),expediente_codigo:EXP.codigo,evaluacion_codigo:EVA.codigo,fecha_creacion:NOW()};Object.assign(x,{decision:d,porque:pq,texto_solicitante:tr,decidido_por:SES.codigo||SES.nombre||"",decisor_nombre:SES.nombre||"",fecha_decision:NOW(),revision_completa:true,sin_conflicto:true,asistida_por_rita:!!EVA.rita_conclusion,verificacion_rita:{estado:"VERIFICADA",verificada_por:SES.codigo||SES.nombre||"",fecha:NOW(),comprobaciones:["La recomendación de Rita© se basó en la evaluación registrada","El POR QUÉ es visible y trazable","El decisor revisó el expediente","La decisión final fue humana"]}});if(!DEC)D.decisiones.push(x);DEC=x;await write("decisiones");if(d==="CERTIFICAR"){EXP.estado="DECISIÓN FAVORABLE";EXP.fase="CERTIFICACIÓN";EXP.llave_actual="CERTIFICACION";EXP.estado_certificacion="PENDIENTE_EMISION"}else if(d==="NO CERTIFICAR"){EXP.estado="DECISIÓN DESFAVORABLE";EXP.fase="DECISIÓN FINALIZADA";EXP.llave_actual="DECISION";EXP.estado_certificacion="NO_CERTIFICADO"}else{EXP.estado="CANDIDATO EVALUABLE";EXP.fase="LLAVE 3 · EVALUACIÓN";EXP.llave_actual="EVALUACION";EVA.estado="DEVUELTA A EVALUACIÓN";EVA.enviado_a5=false}EXP.fecha_actualizacion=NOW();EXP.decision_codigo=x.codigo;EXP.decision=d;EXP.decision_porque=pq;EXP.decision_texto_solicitante=tr;await write("expedientes");await write("evaluaciones");msg("Decisión guardada.");setTimeout(()=>{pintar();abrir(EXP.codigo)},400)}
